---
- name: Allow {{ ansible_user_id }} passwordless sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/99-{{ ansible_user_id }}"
    content: "{{ ansible_user_id }} ALL=(ALL) NOPASSWD: ALL\n"
    mode: "0440"
    validate: "visudo -cf %s"
  become: true

- name: Install ssh-audit (for verifying the hardening below)
  ansible.builtin.apt:
    name: ssh-audit
    state: present
  become: true

# https://www.ssh-audit.com/hardening_guides.html
- name: Restrict supported SSH key exchange, cipher, and MAC algorithms
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/ssh-audit_hardening.conf
    content: |
      KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,gss-curve25519-sha256-,diffie-hellman-group16-sha512,gss-group16-sha512-,diffie-hellman-group18-sha512,diffie-hellman-group-exchange-sha256
      Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
      MACs hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,umac-128-etm@openssh.com
      HostKeyAlgorithms sk-ssh-ed25519-cert-v01@openssh.com,ssh-ed25519-cert-v01@openssh.com,rsa-sha2-512-cert-v01@openssh.com,rsa-sha2-256-cert-v01@openssh.com,sk-ssh-ed25519@openssh.com,ssh-ed25519,rsa-sha2-512,rsa-sha2-256
      RequiredRSASize 3072
      CASignatureAlgorithms sk-ssh-ed25519@openssh.com,ssh-ed25519,rsa-sha2-512,rsa-sha2-256
      GSSAPIKexAlgorithms gss-curve25519-sha256-,gss-group16-sha512-
      HostbasedAcceptedAlgorithms sk-ssh-ed25519-cert-v01@openssh.com,ssh-ed25519-cert-v01@openssh.com,sk-ssh-ed25519@openssh.com,ssh-ed25519,rsa-sha2-512-cert-v01@openssh.com,rsa-sha2-512,rsa-sha2-256-cert-v01@openssh.com,rsa-sha2-256
      PubkeyAcceptedAlgorithms sk-ssh-ed25519-cert-v01@openssh.com,ssh-ed25519-cert-v01@openssh.com,sk-ssh-ed25519@openssh.com,ssh-ed25519,rsa-sha2-512-cert-v01@openssh.com,rsa-sha2-512,rsa-sha2-256-cert-v01@openssh.com,rsa-sha2-256
  become: true
  register: sshd_hardening_conf
  notify: restart sshd

# Validates the live merged sshd_config (this drop-in plus everything
# else already on disk) before the handler restarts sshd -- a syntax
# error here would otherwise only surface *after* sshd reloads and
# could lock out SSH access to a headless Pi.
- name: Validate sshd config
  ansible.builtin.command: sshd -t
  become: true
  changed_when: false
  when: sshd_hardening_conf.changed

# sshd -t only checks syntax, not whether the connecting client's SSH
# library actually supports one of the whitelisted algorithms above. This
# schedules an unconditional revert-and-restart a few minutes out; it's
# cancelled below once this same ansible run proves the restarted sshd
# still accepts the connection it's running over. Mirrors the nftables
# safety net in roles/firewall.
- name: Schedule a safety-net sshd hardening rollback
  ansible.builtin.command: >-
    systemd-run --unit=sshd-hardening-safety-net --on-active=3min
    /bin/sh -c "rm -f /etc/ssh/sshd_config.d/ssh-audit_hardening.conf && systemctl restart ssh"
  become: true
  changed_when: true
  when: sshd_hardening_conf.changed

# Handlers are normally deferred to the end of the play, which would run
# the "restart sshd" handler *after* the firewall role's own safety net
# has already been set up, confirmed, and cancelled -- leaving the sshd
# restart with no rollback protection of its own. Flush now so the
# restart (and the connectivity check below) happen immediately, while
# the safety net scheduled above is still armed.
- name: Flush handlers to restart sshd now
  ansible.builtin.meta: flush_handlers

- name: Confirm SSH access survived the hardening restart
  ansible.builtin.wait_for_connection:
    timeout: 30
  when: sshd_hardening_conf.changed

- name: Cancel the safety-net sshd hardening rollback now that access is confirmed
  ansible.builtin.command: systemctl stop sshd-hardening-safety-net.timer
  become: true
  changed_when: true
  failed_when: false
  when: sshd_hardening_conf.changed
