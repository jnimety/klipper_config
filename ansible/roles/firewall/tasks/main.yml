---
- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present
  become: true

# SSH is always allowed. Every printer's webcam and Moonraker's
# API/websocket are always fronted by nginx (roles/webcam_https_proxy),
# which owns moonraker_ssl_port itself (moonraker.conf no longer sets
# ssl_port, to avoid a bind conflict -- see printers/*/moonraker.conf),
# so existing external configs pointed at that port keep working
# unchanged. Moonraker's plain port and webcam_port stay bound but
# unreachable from the LAN, since nginx reaches both over loopback
# (already allowed via `iif "lo" accept`).
- name: Compute this printer's allowed tcp ports
  ansible.builtin.set_fact:
    firewall_tcp_ports: "{{ [22, 443, moonraker_ssl_port] }}"

- name: Render nftables ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0640"
    validate: "nft -c -f %s"
  become: true
  register: nftables_conf

# A ruleset mistake (wrong port, wrong trusted range) would otherwise
# silently lock out SSH to a headless Pi with no console access. This
# schedules an unconditional flush (fully open) a few minutes out;
# it's cancelled below once this same ansible run proves the new
# ruleset didn't break the connection it's running over.
- name: Schedule a safety-net firewall rollback
  ansible.builtin.command: >-
    systemd-run --unit=nftables-safety-net --on-active=3min
    /usr/sbin/nft flush ruleset
  become: true
  changed_when: true
  when: nftables_conf.changed

- name: Apply nftables ruleset
  ansible.builtin.systemd:
    name: nftables
    state: "{{ 'restarted' if nftables_conf.changed else 'started' }}"
    enabled: true
  become: true

- name: Confirm SSH access survived the new ruleset
  ansible.builtin.wait_for_connection:
    timeout: 30
  when: nftables_conf.changed

- name: Cancel the safety-net rollback now that access is confirmed
  ansible.builtin.command: systemctl stop nftables-safety-net.timer
  become: true
  changed_when: true
  failed_when: false
  when: nftables_conf.changed
