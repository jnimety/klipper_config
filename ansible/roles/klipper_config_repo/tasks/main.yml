---
# See ../../../README.md "Deploying to a printer" -- this role automates
# that runbook's clone + symlink-swap steps for first-time bootstrap.

- name: Check current state of printer_data/config
  ansible.builtin.stat:
    path: "{{ printer_data }}/config"
  register: config_path

# Deliberately not the shared git_clone role (which every other clone in
# this playbook uses with update: false -- see ansible/README.md "What
# this does NOT do"): this checkout IS the live config, not a software
# release to pin, so pulling latest on every run is the actual "deploy"
# step from the main README's "Deploying to a printer" runbook, and the
# handlers below restart klipper/moonraker to match (print-safety
# checked, same as a manual redeploy would require anyway).
- name: Clone or update klipper_config repo
  ansible.builtin.git:
    repo: "{{ klipper_config_repo_url }}"
    dest: "{{ klipper_config_home }}"
    version: main
    update: true
  register: klipper_config_git

# The git module only sets `before` on an existing checkout (never on a
# first-time clone), so this naturally skips notifying on first bootstrap
# -- when klipper.service/moonraker.service may not even be installed
# yet by the roles that run after this one.
- name: Restart klipper/moonraker for pulled config changes
  ansible.builtin.debug:
    msg: "klipper_config updated {{ klipper_config_git.before }} -> {{ klipper_config_git.after }}"
  changed_when: true
  when:
    - klipper_config_git.before is defined
    - klipper_config_git.before != klipper_config_git.after
  notify:
    - restart klipper
    - restart moonraker

- name: Back up existing non-symlink printer_data/config
  ansible.builtin.command: >
    mv {{ printer_data }}/config {{ printer_data }}/config.bak-{{ ansible_facts['date_time'].iso8601_basic_short }}
  args:
    removes: "{{ printer_data }}/config"
  when: config_path.stat.exists and not config_path.stat.islnk

- name: Symlink printer_data/config to this printer's tracked config
  ansible.builtin.file:
    src: "{{ klipper_config_home }}/printers/{{ printer_name }}"
    dest: "{{ printer_data }}/config"
    state: link
    force: true

- name: Check whether host-local secrets.conf is present
  ansible.builtin.stat:
    path: "{{ printer_data }}/config/secrets.conf"
  register: secrets_conf

- name: Warn if secrets.conf is missing
  ansible.builtin.debug:
    msg: >-
      secrets.conf not found at {{ printer_data }}/config/secrets.conf.
      It's gitignored and host-local (see the repo's CLAUDE.md "Secrets"
      section) -- copy it forward manually before moonraker-telegram-bot
      can authenticate.
  when: not secrets_conf.stat.exists
