---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install base packages
  ansible.builtin.apt:
    name:
      - git
      - curl
      - ca-certificates
      - avahi-daemon
      - virtualenv
      - python3-virtualenv
      - python3-dev
      - python3-pip
    state: present
  become: true

# tty: klipper_host_mcu's pty is owned root:tty (see repo README's
# ldo-picobilical.cfg notes on [mcu rpi]/ADXL345 host-MCU setup).
# dialout: serial access to the main/toolhead MCU boards.
# gpio/i2c: raspi-config-managed hardware interfaces.
# video: the USB webcam device node crowsnest/ustreamer reads from.
- name: Add {{ ansible_facts['user_id'] }} to hardware access groups
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups:
      - dialout
      - tty
      - gpio
      - i2c
      - video
    append: true
  become: true
  register: user_groups_changed

- name: Check current SPI interface state
  ansible.builtin.command: raspi-config nonint get_spi
  become: true
  register: spi_state
  changed_when: false

# Both printers' [mcu rpi] section needs SPI (BLTouch/gpio wiring on
# klipper-vs-146, the Picobilical's onboard ADXL345 on klipper-v0-4432).
- name: Enable SPI interface
  ansible.builtin.command: raspi-config nonint do_spi 0
  become: true
  when: spi_state.stdout | trim == "1"
  register: spi_enabled

# Trixie's current swap manager. Conflicts/Replaces/Provides
# dphys-swapfile, so this cleanly removes the older package as part
# of the same apt transaction. Stock "auto" mechanism (zram+file) is
# used as-is -- no custom swap.conf.d sizing for now.
- name: Install rpi-swap (replaces dphys-swapfile)
  ansible.builtin.apt:
    name: rpi-swap
    state: present
  become: true
  register: rpi_swap_installed

# The stock "auto" mechanism resolves to zram+file, whose swap capacity
# is backed by real RAM (just compressed) -- it can't give headroom
# beyond physical RAM. Confirmed insufficient on klipper-vs-146: the
# OOM killer took out cc1 mid-build (nvim-treesitter compiling a parser)
# with both RAM and zram swap pinned near full. A real disk-backed
# swapfile is what "increase the swapfile to 4G" always meant to give;
# forcing Mechanism=swapfile here is what actually delivers that.
- name: Create rpi-swap drop-in directory
  ansible.builtin.file:
    path: /etc/rpi/swap.conf.d
    state: directory
    mode: "0755"
  become: true

- name: Force rpi-swap to use a traditional disk-backed 4G swapfile
  ansible.builtin.copy:
    dest: /etc/rpi/swap.conf.d/80-use-swapfile.conf
    content: |
      [Main]
      Mechanism=swapfile

      [File]
      FixedSizeMiB={{ swap_size_mib }}
    mode: "0644"
  become: true
  register: rpi_swap_configured

# Raspberry Pi OS ships these enabled by default, but neither printer host
# has any use for them: no cellular modem (ModemManager), no paired BT
# peripherals (bluetooth/hciuart -- the CSI camera and MCU boards don't
# touch this), no NFS mounts (nfs-blkmap), and no local mail recipient
# (exim4 -- moonraker-telegram-bot already owns notifications, see
# macros/notify.cfg). Masked, not just disabled, so nothing (an apt
# upgrade of the package, a udev rule for hciuart's dev-serial1.device)
# re-enables them later. Confirmed exim4 alone holds ~22MB RSS on
# klipper-v0-4432's 1GB Pi 4, which is real headroom on a host already
# touching swap.
- name: Disable and mask unnecessary default services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    masked: true
    state: stopped
  become: true
  loop:
    - exim4.service
    - ModemManager.service
    - bluetooth.service
    - hciuart.service
    - nfs-blkmap.service

# A previous run of this same role may have already held
# firmware-brcm80211 at a different version -- apt refuses to touch a
# held package non-interactively even with allow_downgrade, so clear any
# existing hold before (re-)pinning. Always run when a pin is wanted;
# harmless/no-op if nothing was held.
- name: Ensure firmware-brcm80211 isn't held before (re-)pinning it
  ansible.builtin.dpkg_selections:
    name: firmware-brcm80211
    selection: install
  become: true
  when: firmware_brcm80211_pin_version | length > 0

# See host_vars/klipper-v0-4432.yml for the 2026-09-18 WiFi-auth-failure
# incident this pins against. allow_downgrade so this also self-heals a
# host that already picked up the regressed version before the pin
# existed. apt-mark hold (not just installing the pinned version) is
# what actually stops apt-daily-upgrade.timer from pulling it back in.
- name: Pin firmware-brcm80211 to a known-good version
  ansible.builtin.apt:
    name: "firmware-brcm80211={{ firmware_brcm80211_pin_version }}"
    state: present
    allow_downgrade: true
  become: true
  when: firmware_brcm80211_pin_version | length > 0

- name: Hold firmware-brcm80211 at that version
  ansible.builtin.dpkg_selections:
    name: firmware-brcm80211
    selection: hold
  become: true
  when: firmware_brcm80211_pin_version | length > 0

- name: Create printer_data directory skeleton
  ansible.builtin.file:
    path: "{{ printer_data }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - config
    - logs
    - gcodes
    - comms
    - certs
    - systemd
    - backup

- name: Reboot if an interface/group/swap change requires it
  ansible.builtin.reboot:
  become: true
  when: >
    reboot_if_required and
    ((spi_enabled is defined and spi_enabled.changed) or
     user_groups_changed.changed or
     rpi_swap_installed.changed or
     rpi_swap_configured.changed)
