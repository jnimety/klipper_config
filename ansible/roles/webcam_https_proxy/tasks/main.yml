# Runs on every printer unconditionally, for identical behavior across
# the fleet. One TLS vhost, reusing Moonraker's own certs, that puts
# both the webcam stream (crowsnest has no TLS of its own) and
# Moonraker's API/websocket (in place of its own HTTPS) behind HTTPS --
# see webcam.conf.j2. No static file serving -- no local Mainsail/Fluidd
# UI is served here, that runs off-host.
#
# Moonraker turns on its own HTTPS server purely based on whether cert/key
# files exist at its data-path default ({{ printer_data }}/certs/moonraker.
# {cert,key}) -- NOT on whether ssl_port is set in moonraker.conf (that
# option only picks which port to use, defaulting to 7130 even when
# entirely absent from the config). Each host's certs have therefore been
# manually renamed, once, from moonraker.{cert,key} to nginx.{cert,key} --
# a one-time step on the host itself, outside this playbook (see the main
# repo's CLAUDE.md and this directory's README "What this does NOT do")
# -- so Moonraker finds nothing at its auto-discovered path and never
# starts its own HTTPS server at all, leaving nginx free to bind 7130
# without a startup-order race against Moonraker for the same port.
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
  become: true
- name: Remove nginx default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  become: true
  notify: reload nginx
- name: Install printer TLS proxy vhost
  ansible.builtin.template:
    src: webcam.conf.j2
    dest: /etc/nginx/sites-available/webcam
    mode: "0644"
  become: true
  notify: reload nginx
- name: Enable printer vhost
  ansible.builtin.file:
    src: /etc/nginx/sites-available/webcam
    dest: /etc/nginx/sites-enabled/webcam
    state: link
  become: true
  notify: reload nginx
