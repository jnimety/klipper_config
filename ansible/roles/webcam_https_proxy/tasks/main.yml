# Runs on every printer unconditionally, for identical behavior across
# the fleet. One TLS vhost, reusing Moonraker's own certs, that puts
# both the webcam stream (crowsnest has no TLS of its own) and
# Moonraker's API/websocket (in place of its own ssl_port) behind
# HTTPS -- see webcam.conf.j2. No static file serving -- no local
# Mainsail/Fluidd UI is served here, that runs off-host.
# klipper_config_repo clones with update: false, so editing moonraker.conf
# in the repo alone won't reach an already-provisioned host. Enforce the
# live file directly instead, and free the port *before* nginx's vhost
# below tries to bind it -- otherwise nginx fails to reload with an
# "address already in use" error.
- name: Remove Moonraker's own ssl_port now that nginx fronts it instead
  ansible.builtin.lineinfile:
    path: "{{ printer_data }}/config/moonraker.conf"
    regexp: "^ssl_port:"
    state: absent
  register: moonraker_ssl_port_removed
- name: Restart Moonraker to release ssl_port
  ansible.builtin.systemd:
    name: moonraker
    state: restarted
  become: true
  when: moonraker_ssl_port_removed.changed

- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
  become: true
- name: Remove nginx default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  become: true
  notify: reload nginx
- name: Install printer TLS proxy vhost
  ansible.builtin.template:
    src: webcam.conf.j2
    dest: /etc/nginx/sites-available/webcam
    mode: "0644"
  become: true
  notify: reload nginx
- name: Enable printer vhost
  ansible.builtin.file:
    src: /etc/nginx/sites-available/webcam
    dest: /etc/nginx/sites-enabled/webcam
    state: link
  become: true
  notify: reload nginx
