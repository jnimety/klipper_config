---
# update: false -- same reasoning as the klipper role: this ensures
# Moonraker is present, ongoing upgrades stay a deliberate, separate step.
- name: Clone Moonraker
  ansible.builtin.git:
    repo: "{{ moonraker_repo_url }}"
    dest: "{{ moonraker_home }}"
    version: master
    update: false

# Moonraker's own install script is non-interactive and idempotent; it
# shells out to sudo itself for the apt/systemd/polkit steps, so this
# task intentionally does NOT become:true -- it needs to run as the
# printer user, same as if you'd SSH'd in and run it by hand. Assumes
# passwordless sudo for that user (the Raspberry Pi OS default).
- name: Run Moonraker's official installer
  ansible.builtin.command: "{{ moonraker_home }}/scripts/install-moonraker.sh"
  args:
    creates: /etc/systemd/system/moonraker.service
  environment:
    MOONRAKER_VENV: "{{ moonraker_env }}"
