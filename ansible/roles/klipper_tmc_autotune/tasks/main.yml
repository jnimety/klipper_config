---
- name: Clone klipper_tmc_autotune
  ansible.builtin.include_role:
    name: git_clone
  vars:
    git_clone_repo: "{{ klipper_tmc_autotune_repo_url }}"
    git_clone_dest: "{{ ansible_env.HOME }}/klipper_tmc_autotune"
    git_clone_version: main

# Not become:true -- the script rejects running as EUID 0 and calls sudo
# itself for the one step that needs it (restarting klipper). It doesn't
# touch moonraker.conf; the [update_manager klipper_tmc_autotune] block is
# already committed in each printer's moonraker.conf.
- name: Run klipper_tmc_autotune's installer
  ansible.builtin.command: ./install.sh
  args:
    chdir: "{{ ansible_env.HOME }}/klipper_tmc_autotune"
    creates: "{{ klipper_home }}/klippy/extras/autotune_tmc.py"
