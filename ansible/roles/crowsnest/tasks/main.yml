---
- name: Clone crowsnest
  ansible.builtin.include_role:
    name: git_clone
  vars:
    git_clone_repo: "{{ crowsnest_repo_url }}"
    git_clone_dest: "{{ ansible_facts['env'].HOME }}/crowsnest"
    git_clone_version: master

# crowsnest's own Makefile comment says "needs leading sudo" -- its
# install.sh checks $SUDO_USER and rejects being run *as* root directly
# (as opposed to via sudo), so become:true here (not internal sudo calls
# like the moonraker/klipper_tmc_autotune/shaketune installers).
# CROWSNEST_ADD_CROWSNEST_MOONRAKER=1 appends an [update_manager crowsnest]
# block to moonraker.conf the same way Shake&Tune's installer already added
# the [update_manager Klippain-ShakeTune] block that's committed in this
# repo today -- expect a moonraker.conf diff after the first run.
- name: Run crowsnest's unattended installer
  ansible.builtin.command: bash tools/install.sh
  args:
    chdir: "{{ ansible_facts['env'].HOME }}/crowsnest"
    creates: /etc/systemd/system/crowsnest.service
  become: true
  environment:
    CROWSNEST_UNATTENDED: "1"
    CROWSNEST_ADD_CROWSNEST_MOONRAKER: "1"
    BASE_USER: "{{ ansible_facts['user_id'] }}"
    SUDO_USER: "{{ ansible_facts['user_id'] }}"

# The installer wrote crowsnest.conf (and possibly touched moonraker.conf)
# as root; both live under printer_data/config, which is this git repo's
# working tree -- hand them back to the printer user so `git status`/commits
# there don't need sudo.
- name: Check ownership targets exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ printer_data }}/config/crowsnest.conf"
    - "{{ printer_data }}/config/moonraker.conf"
  register: cfg_stats

- name: Restore ownership of crowsnest-touched config files
  ansible.builtin.file:
    path: "{{ item.item }}"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
  loop: "{{ cfg_stats.results }}"
  when: item.stat.exists
  become: true

- name: Set webcam mode in crowsnest.conf
  ansible.builtin.lineinfile:
    path: "{{ printer_data }}/config/crowsnest.conf"
    regexp: '^mode:'
    line: "mode: {{ webcam_mode }}"
  notify: restart crowsnest

- name: Set webcam device in crowsnest.conf
  ansible.builtin.lineinfile:
    path: "{{ printer_data }}/config/crowsnest.conf"
    regexp: '^device:'
    line: "device: {{ webcam_device }}"
  notify: restart crowsnest

- name: Set webcam resolution in crowsnest.conf
  ansible.builtin.lineinfile:
    path: "{{ printer_data }}/config/crowsnest.conf"
    regexp: '^resolution:'
    line: "resolution: {{ webcam_resolution }}"
  notify: restart crowsnest

- name: Set webcam max_fps in crowsnest.conf
  ansible.builtin.lineinfile:
    path: "{{ printer_data }}/config/crowsnest.conf"
    regexp: '^max_fps:'
    line: "max_fps: {{ webcam_max_fps }}"
  notify: restart crowsnest

# crowsnest defaults to binding the stream to 127.0.0.1, assuming a reverse
# proxy sits in front of it -- true here, since every printer's webcam is
# always fronted by nginx (see the webcam_https_proxy role).
- name: Set no_proxy in crowsnest.conf so the stream stays loopback-only
  ansible.builtin.lineinfile:
    path: "{{ printer_data }}/config/crowsnest.conf"
    regexp: '^no_proxy:'
    line: "no_proxy: false"
  notify: restart crowsnest

# Always runs (rather than only `when webcam_custom_flags | length > 0`)
# so that resetting webcam_custom_flags back to the empty-string default
# actually clears a previously-set line instead of leaving it stale --
# lineinfile only reports changed (and only then notifies a restart) if
# the line's content actually differs, so this stays a no-op otherwise.
- name: Set webcam custom_flags in crowsnest.conf
  ansible.builtin.lineinfile:
    path: "{{ printer_data }}/config/crowsnest.conf"
    regexp: '^#?custom_flags:'
    line: "{{ 'custom_flags: ' + webcam_custom_flags if webcam_custom_flags | length > 0 else '#custom_flags:' }}"
  notify: restart crowsnest

# Retired 2026-09-08: the ExecStartPre=/bin/sleep drop-in this used to
# install (gated on a per-host webcam_start_delay var) only ever addressed
# crowsnest's boot-time camera race on klipper-vs-146. It never covered
# the much more common failure the crowsnest-healthcheck timer below
# handles instead -- camera-streamer dying hours into an otherwise
# healthy run (observed on klipper-v0-4432 2026-09-08) -- since crowsnest
# tries to open the camera exactly once and never retries either way.
# One generic "is the stream actually up?" check subsumes the narrower
# boot-only fix, so this cleans up any drop-in a previous run installed
# rather than leaving it stale now that no task manages it going forward.
- name: Remove retired crowsnest startup-delay drop-in, if present
  ansible.builtin.file:
    path: /etc/systemd/system/crowsnest.service.d
    state: absent
  become: true
  notify: restart crowsnest

# crowsnest has no self-recovery for a libcamera camera-streamer subprocess
# that crashes or fails to open the camera on its one and only startup
# attempt (see libs/watchdog.sh -- it explicitly skips any device path
# matching /base/soc, i.e. every CSI/libcamera camera) -- the stream then
# stays dead until something restarts crowsnest.service itself. This
# timer+script pair is that "something": poll the local stream and
# restart the service if it's unresponsive.
- name: Install crowsnest webcam health-check script
  ansible.builtin.template:
    src: crowsnest-healthcheck.sh.j2
    dest: /usr/local/bin/crowsnest-healthcheck.sh
    mode: "0755"
  become: true

- name: Install crowsnest-healthcheck systemd service
  ansible.builtin.template:
    src: crowsnest-healthcheck.service.j2
    dest: /etc/systemd/system/crowsnest-healthcheck.service
    mode: "0644"
  become: true
  notify: restart crowsnest-healthcheck timer

- name: Install crowsnest-healthcheck systemd timer
  ansible.builtin.template:
    src: crowsnest-healthcheck.timer.j2
    dest: /etc/systemd/system/crowsnest-healthcheck.timer
    mode: "0644"
  become: true
  notify: restart crowsnest-healthcheck timer

- name: Enable and start crowsnest-healthcheck timer
  ansible.builtin.systemd:
    name: crowsnest-healthcheck.timer
    enabled: true
    state: started
    daemon_reload: true
  become: true
