printer_name: klipper-vs-146
# Raspberry Pi Camera Module 3 Wide (IMX708, CSI ribbon), replacing the
# original Camera Module v2.1 as of 2026-09-25. Same camera-streamer/
# libcamera path/quirks as klipper-v0-4432's Camera Module 3 -- see its
# host_vars for the --camera-snapshot.height=1080 hardcode/pipeline note.
webcam_mode: camera-streamer
webcam_device: /base/soc/i2c0mux/i2c@1/imx708@1a
webcam_resolution: "2304x1296"
webcam_max_fps: 30
# In the wide FOV, the enclosure's blue status LED (see notify.cfg) blew
# out to solid white against the dark interior under default auto-exposure.
# AeConstraintMode=1 (libcamera "Highlight" mode) biases AE to protect
# highlights instead of metering for the whole dark scene, plus a modest
# negative ExposureValue on top. Left AE enabled (no manual exposure lock)
# since the LED's color/brightness changes across print phases.
webcam_custom_flags: "--camera-nbufs=2 --camera-video.height=1296 --camera-stream.height=1296 --camera-snapshot.height=1296 --camera-options=\"AfMode=2\" --camera-options=\"AeConstraintMode=1\" --camera-options=\"ExposureValue=-0.7\" --camera-hflip --camera-vflip"
# Observed 2026-09-06: after a reboot (likely from a libcamera package
# upgrade), crowsnest.service started before the libcamera/Unicam
# pipeline for this CSI camera was fully up. camera-streamer's one open
# attempt failed ("Cannot open device"), and crowsnest never retried on
# its own -- the webcam stayed dead (nginx 502 on /webcam/) for hours
# until a manual `systemctl restart crowsnest`, by which point the
# camera was free and it started fine. Originally worked around here
# with a per-host webcam_start_delay (a fixed ExecStartPre sleep); retired
# 2026-09-08 in favor of the fleet-wide crowsnest-healthcheck timer (see
# group_vars/all.yml), which subsumes this boot race along with
# camera-streamer crashing mid-run (observed on klipper-v0-4432).

# 2026-09-18: same regression and same fix as klipper-v0-4432's host_vars
# describes in full -- firmware-brcm80211 1:20260519-1~bpo13+1+rpt1 (same
# BCM4345/6 chip, same build) broke v0's WiFi auth entirely. This host
# was running the identical build and happened to come up fine on its
# most recent reboot (no external_auth errors, wlan0 connected) -- but
# since the regression is confirmed intermittent rather than
# AP-specific, that was luck, not evidence this host is unaffected.
# Downgraded to the same known-good 20250410-2 (Debian's own
# non-RPi-specific build, generic BCM4345/6 blob) as v0 rather than
# leaving this host on the untested-but-working version.
firmware_brcm80211_pin_version: "20250410-2"
