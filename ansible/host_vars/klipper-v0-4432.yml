printer_name: klipper-v0-4432
# Raspberry Pi Camera Module 3 (IMX708, CSI ribbon), connected 2026-09-06.
# Confirmed via `rpicam-hello --list-cameras` over SSH: sensor exposes
# 1536x864/2304x1296/4608x2592 modes (all 16:9 crops of the native
# 4608x2592 array). Same camera-streamer/libcamera path as
# klipper-vs-146's Camera Module v2 -- see its host_vars for the pattern.
webcam_mode: camera-streamer
webcam_device: /base/soc/i2c0mux/i2c@1/imx708@1a
webcam_resolution: "2304x1296"
webcam_max_fps: 30
# crowsnest's camera-streamer backend hardcodes --camera-snapshot.height=
# 1080 (libs/camera-streamer.sh) and never sets --camera-nbufs/
# --camera-video.height/--camera-stream.height -- on klipper-vs-146 that
# 1080-vs-1232 mismatch broke the H.264 pipeline (WebRTC produced zero
# video RTP packets; MJPG tolerated it fine). Matching all four to this
# printer's own 1296 stream height up front avoids hitting that same bug
# here. custom_flags is appended after crowsnest's own flags, so this
# --camera-snapshot.height overrides the hardcoded 1080 (last value
# wins). Confirmed upside down on the live stream (2026-09-06), same as
# klipper-vs-146's mount -- hflip+vflip (full 180 deg) added below.
webcam_custom_flags: "--camera-nbufs=2 --camera-video.height=1296 --camera-stream.height=1296 --camera-snapshot.height=1296 --camera-hflip --camera-vflip"
# --- Live OS hostname rename (roles/hostname) ---
# This host's Pi-Imager-flashed hostname is still "klipper-v0". Renaming
# it to match this printer's new serial-number identity, V0.4432. The
# alias publisher below is what lets klipper-v0.local keep resolving
# afterward -- see roles/hostname/tasks/main.yml. Defining this var is
# what triggers the rename the next time the playbook runs against this
# host -- do that deliberately (e.g. `--limit klipper-v0-4432`), not as
# part of a routine both-printers run, until you're ready for it to land.
desired_hostname: klipper-v0-4432
# Old real hostname(s) to keep answering at <name>.local via a
# standalone avahi-publish service, for back-compat with old
# bookmarks/scripts that still point at klipper-v0.local.
mdns_aliases:
  - klipper-v0
