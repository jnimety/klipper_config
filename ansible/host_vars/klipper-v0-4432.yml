printer_name: klipper-v0-4432
# Raspberry Pi Camera Module 3 (IMX708, CSI ribbon), connected 2026-09-06.
# Confirmed via `rpicam-hello --list-cameras` over SSH: sensor exposes
# 1536x864/2304x1296/4608x2592 modes (all 16:9 crops of the native
# 4608x2592 array). Same camera-streamer/libcamera path as
# klipper-vs-146's Camera Module v2 -- see its host_vars for the pattern.
webcam_mode: camera-streamer
webcam_device: /base/soc/i2c0mux/i2c@1/imx708@1a
webcam_resolution: "2304x1296"
webcam_max_fps: 30
# crowsnest's camera-streamer backend hardcodes --camera-snapshot.height=
# 1080 (libs/camera-streamer.sh) and never sets --camera-nbufs/
# --camera-video.height/--camera-stream.height -- on klipper-vs-146 that
# 1080-vs-1232 mismatch broke the H.264 pipeline (WebRTC produced zero
# video RTP packets; MJPG tolerated it fine). Matching all four to this
# printer's own 1296 stream height up front avoids hitting that same bug
# here. custom_flags is appended after crowsnest's own flags, so this
# --camera-snapshot.height overrides the hardcoded 1080 (last value
# wins). Was upside down on the live stream as first mounted (2026-09-06,
# same as klipper-vs-146's mount) so hflip+vflip (full 180 deg) were added;
# remounted 2026-09-08 with the orientation corrected physically, so the
# software flip was removed again -- don't re-add it without re-checking
# the live stream first.
# Camera is corner-mounted at nozzle height; bed is 120x120mm, so bed
# center sits ~85mm away (half-diagonal). AfMode=0 (manual) + LensPosition
# (diopters, 1/distance_m) locks focus there instead of relying on
# continuous AF -- tried AfMode=2/AfRange=1 (continuous, macro range) first
# but it hunted constantly against the mostly-bare bed's lack of texture.
webcam_custom_flags: "--camera-nbufs=4 --camera-video.height=1296 --camera-stream.height=1296 --camera-snapshot.height=1296 --camera-options=\"AfMode=0\" --camera-options=\"LensPosition=11.8\""
# --- Live OS hostname rename (roles/hostname) ---
# This host's Pi-Imager-flashed hostname is still "klipper-v0". Renaming
# it to match this printer's new serial-number identity, V0.4432. The
# alias publisher below is what lets klipper-v0.local keep resolving
# afterward -- see roles/hostname/tasks/main.yml. Defining this var is
# what triggers the rename the next time the playbook runs against this
# host -- do that deliberately (e.g. `--limit klipper-v0-4432`), not as
# part of a routine both-printers run, until you're ready for it to land.
desired_hostname: klipper-v0-4432
# Old real hostname(s) to keep answering at <name>.local via a
# standalone avahi-publish service, for back-compat with old
# bookmarks/scripts that still point at klipper-v0.local.
mdns_aliases:
  - klipper-v0
# 2026-09-18: firmware-brcm80211 1:20260519-1~bpo13+1+rpt1 (Raspberry Pi's
# own build, landed via a routine unattended-upgrade that sat un-rebooted
# for 16 days) ships an RPi-4-specific BCM4345/6 blob
# (brcmfmac43455-sdio.raspberrypi,4-model-b.bin, firmware build 7.45.265
# "28bca26 CY") that fails 802.11 auth against this printer's AP --
# wlan0 stuck NO-CARRIER, dmesg spamming
# `brcmf_cyw_external_auth: External authentication failed: status=1`
# forever. Confirmed via dmesg firmware version string, not just a config
# issue -- the saved NetworkManager profile is plain WPA2-PSK (no
# SAE/WPA3 involved) and the AP's own RSN IE only advertises PSK. Neither
# the kernel version (tested 6.18.39 vs 6.18.50 -- both fail identically)
# nor NetworkManager/wpasupplicant is the cause; only the firmware blob
# is. Debian's own (non-RPi-specific) 20250410-2 build has no
# board-specific variant for this chip, so the driver falls back to the
# generic BCM4345/6 blob (build 7.45.234, dated 2021) instead, which
# works. Pinned via apt-mark hold on the host too so
# apt-daily-upgrade.timer can't silently pull the regression back in --
# re-test with a newer firmware-brcm80211 before ever removing this pin.
firmware_brcm80211_pin_version: "20250410-2"
