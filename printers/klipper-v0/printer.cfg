[include ldo-picobilical.cfg]

#####################################################################
# Macros
#####################################################################

[include macros/heat_soak.cfg]
[include macros/prime_line.cfg]
[include macros/print_start.cfg]
[include macros/notify.cfg]
[include macros/filament.cfg]

[gcode_macro PRINT_START_NOTIFY]
description: Called by the shared PRINT_START.
gcode:
  _LED_SET NAME=blue LED=bed_light MSG="{params.MSG}"

[gcode_macro PRINT_END_NOTIFY]
description: Called by PRINT_END.
gcode:
  _LED_SET NAME=green LED=bed_light MSG="{params.MSG}"

[gcode_macro HEAT_SOAK_NOTIFY]
description: Called by the shared HEAT_SOAK once it starts an actual soak.
gcode:
  _LED_SET NAME=orange LED=bed_light MSG="{params.MSG}"

[gcode_macro ATTENTION_NOTIFY]
description: Call wherever the printer pauses for manual user input.
gcode:
  _LED_SET NAME=yellow LED=bed_light PULSE=1 MSG="{params.MSG}"

[gcode_macro RESUME_NOTIFY]
description: Called via mainsail.cfg's user_resume_macro hook, before RESUME_BASE runs.
gcode:
  _LED_SET NAME=blue LED=bed_light MSG="Print resumed."

# mainsail.cfg's own [gcode_macro _CLIENT_VARIABLE] template is fully commented out (it's a
# vendored, read-only file meant to be copied in and customized) - only the one variable this
# repo actually needs is set here, not the full template, to avoid silently changing PAUSE/
# CANCEL_PRINT/park behavior that already works fine on its built-in defaults.
[gcode_macro _CLIENT_VARIABLE]
variable_user_resume_macro: "RESUME_NOTIFY"
gcode:

[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customize for your slicer of choice
gcode:
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-4.0 F3600                 ; retract filament
    G91                            ; relative positioning

    #   Get Boundaries
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}

    #   Check end position to determine safe direction to move
    {% if printer.toolhead.position.x < (max_x - 20) %}
        {% set x_safe = 20.0 %}
    {% else %}
        {% set x_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.y < (max_y - 20) %}
        {% set y_safe = 20.0 %}
    {% else %}
        {% set y_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.z < (max_z - 2) %}
        {% set z_safe = 2.0 %}
    {% else %}
        {% set z_safe = max_z - printer.toolhead.position.z %}
    {% endif %}

    G0 Z{z_safe} F3600             ; move nozzle up
    G0 X{x_safe} Y{y_safe} F20000  ; move nozzle to remove stringing
    TURN_OFF_HEATERS
    M107                           ; turn off fan
    G90                            ; absolute positioning
    G0 X60 Y{max_y-10} F3600          ; park nozzle at rear
    PRINT_END_NOTIFY MSG="Print Finished!"

[gcode_macro LOAD_FILAMENT]
description: Load filament (see macros/filament.cfg's _LOAD_FILAMENT for the underlying engine).
gcode:
  _LOAD_FILAMENT EXTRUDER={params.EXTRUDER|default(printer.extruder.target)|int} LENGTH=30 LOAD_SPEED=300 PRIME_LENGTH=15 PRIME_SPEED=150

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament (see macros/filament.cfg's _UNLOAD_FILAMENT for the underlying engine).
gcode:
  _UNLOAD_FILAMENT EXTRUDER={params.EXTRUDER|default(printer.extruder.target)|int} PURGE_LENGTH=10 PURGE_SPEED=300 RETRACT_LENGTH=40 RETRACT_SPEED=1800

# https://docs.vorondesign.com/tuning/sensorless.html
[include homing.cfg]

