[include macros/mainsail.cfg]
[include macros/debug.cfg]

#####################################################################
# System / MCU
#####################################################################

# This file contains common pin mappings for the BIGTREETECH SKR Pico V1.0
# To use this config, the firmware should be compiled for the RP2040 with
# USB communication.

# The "make flash" command does not work on the SKR Pico V1.0. Instead,
# after running "make", copy the generated "out/klipper.uf2" file
# to the mass storage device in RP2040 boot mode

## Voron Design VORON 0.2 SKR Pico V1.0 config

[mcu]
#####################################################################
# Obtain definition by "ls -l /dev/serial/by-id/"
#####################################################################
serial: /dev/serial/by-id/usb-Klipper_rp2040_4550357129103DF8-if00
## serial: /dev/ttyAMA0                      # for UART connection
restart_method: command

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[printer]
kinematics: corexy
max_velocity: 200
max_accel: 2000
max_z_velocity: 15
max_z_accel: 300
square_corner_velocity: 6.0

[exclude_object]

[idle_timeout]
timeout: 1800

#####################################################################
# Sensorless Homing
#####################################################################

[include sensorless_homing.cfg]

#####################################################################
#      X/Y Stepper Settings
#####################################################################

[stepper_x]
step_pin: gpio11
dir_pin: gpio10
enable_pin: !gpio12
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200                 # Set to 400 for 0.9° degree stepper motor, 200 is for 1.8° stepper motors
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 120
position_max: 120
homing_speed: 65
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
interpolate: true
run_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0                     # Set to 999999 to turn stealthchop on, and 0 to use spreadcycle
diag_pin: ^gpio4

[autotune_tmc stepper_x]
motor: ldo-35sth52-1504ah
sg4_thrs: 105

[stepper_y]
step_pin: gpio6
dir_pin: gpio5
enable_pin: !gpio7
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200                 # Set to 400 for 0.9° degree stepper motor, 200 is for 1.8° stepper motors
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 120
position_max: 120
homing_speed: 65
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2
interpolate: true
run_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0                     # Set to 999999 to turn stealthchop on, and 0 to use spreadcycle
diag_pin: ^gpio3

[autotune_tmc stepper_y]
motor: ldo-35sth52-1504ah
sg4_thrs: 105

#####################################################################
#   Z Stepper Settings
#   Using hartk's G2Z mod: https://github.com/hartk1213/MISC/blob/main/Voron%20Mods/Voron%200/0.2/G2Z
#####################################################################

[stepper_z]
step_pin: gpio19
dir_pin: gpio28
enable_pin: !gpio2
rotation_distance: 40                        # For G2Z mod
gear_ratio: 9:1                              # For G2Z mod
microsteps: 32
endstop_pin: ^gpio25
position_max: 121
position_min: -1.5
homing_speed: 20
second_homing_speed: 3.0
homing_retract_dist: 3.0

[tmc2209 stepper_z]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 1
interpolate: true
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0                     # Set to 999999 to turn stealthchop on, and 0 to use spreadcycle

[autotune_tmc stepper_z]
motor: ldo-36sth20-1004ahg

#####################################################################
#   Extruder
#####################################################################

[extruder]
step_pin: gpio14
dir_pin: !gpio13
enable_pin: !gpio15
full_steps_per_rotation: 200                 # Set to 200 for LDO 1.8° stepper motor, and set to 400 for OMC(StepperOnline) 0.9° stepper motor
rotation_distance: 22.307805                 # See calibrating rotation_distance on extruders doc
gear_ratio: 50:10                            # For Mini Afterburner
microsteps: 32
nozzle_diameter: 0.400
filament_diameter: 1.750
# heater_pin: gpio23                         # LDO Picobilical overrides this setting
# sensor_type: ATC Semitec 104NT-4-R025H42G  # LDO Picobilical overrides this setting
# sensor_pin: gpio27                         # LDO Picobilical overrides this setting
min_temp: 0
max_temp: 270
min_extrude_temp: 170
max_extrude_only_distance: 150
max_extrude_cross_section: 0.8
pressure_advance: 0.0352                     # See tuning pressure advance doc
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 3
interpolate: true
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0                     # Set to 0 for spreadcycle, avoid using stealthchop on extruder

[autotune_tmc extruder]
motor: ldo-36sth20-1004ahg

#####################################################################
#   Bed Heater
#####################################################################

[heater_bed]
heater_pin: gpio21
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: gpio26
smooth_time: 3.0
#max_power: 0.6                              # Only needed for 100w pads
min_temp: 0
max_temp: 120

#####################################################################
# Fan Control
#####################################################################

[heater_fan hotend_fan]
# pin: gpio18                                # LDO Picobilical overrides this setting
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
#fan_speed: 1.0                              # You can't PWM the delta fan unless using blue wire

[fan]
# pin: gpio17                                # LDO Picobilical overrides this setting
max_power: 1.0
kick_start_time: 0.5                         # Depending on your fan, you may need to increase this value if your fan will not start
off_below: 0.13
cycle_time: 0.010

[controller_fan pcb_fan]
pin: gpio20
max_power: 1.0
kick_start_time: 0.5
heater: extruder
#fan_speed: 1.0

#####################################################################
#   Filament Runout Sensor
#####################################################################

[filament_switch_sensor Filament_Runout_Sensor]
pause_on_runout: True
runout_gcode: ATTENTION_NOTIFY MSG="⚠️ Filament runout detected, needs your attention."
switch_pin: gpio16
debounce_delay: 0.25                         # Delays 250ms to ensure the switch state is stable

#####################################################################
# Gantry Adjustment
#####################################################################

# To be used with BED_SCREWS_ADJUST
[bed_screws]
screw1: 60,5
screw1_name: front screw
screw2: 5,115
screw2_name: back left
screw3: 115,115
screw3_name: back right

#####################################################################
# Stealth Bed Front Lighting - Kirigami Bed
#####################################################################

[neopixel bed_light]
pin: gpio24
chain_count: 1
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0

# include after main controller config per the instructions in ldo-picobilical.cfg
[include ldo-picobilical.cfg]

[shaketune]

#####################################################################
# Macros
#####################################################################

[include macros/heat_soak.cfg]
[include macros/squiggly_purge.cfg]
[include macros/print_start.cfg]
[include macros/notify.cfg]
[include macros/filament.cfg]
[include macros/print_end.cfg]

[gcode_macro PRINT_START_NOTIFY]
description: Called by the shared PRINT_START.
gcode:
  _LED_SET NAME=blue LED=bed_light STATUS_ONLY=1 MSG="{params.MSG}"

[gcode_macro PRINT_END_NOTIFY]
description: Called by PRINT_END.
gcode:
  _LED_SET NAME=green LED=bed_light MSG="{params.MSG}"

[gcode_macro HEAT_SOAK_NOTIFY]
description: Called whenever PRINT_START is actively heating something (bed, hotend, or chamber soak via HEAT_SOAK) — orange means heating/warming up, not a problem.
gcode:
  _LED_SET NAME=orange LED=bed_light STATUS_ONLY=1 MSG="{params.MSG}"

[gcode_macro HEAT_SOAK_SKIPPED_NOTIFY]
description: Called by the shared HEAT_SOAK when no chamber target is set — nothing to heat, so blue (still just the normal running sequence) rather than orange.
gcode:
  _LED_SET NAME=blue LED=bed_light STATUS_ONLY=1 MSG="{params.MSG}"

[gcode_macro ATTENTION_NOTIFY]
description: Call wherever the printer pauses for manual user input.
gcode:
  _LED_SET NAME=yellow LED=bed_light PULSE=1 MSG="{params.MSG}"

[gcode_macro RESUME_NOTIFY]
description: Called via mainsail.cfg's user_resume_macro hook, before RESUME_BASE runs.
gcode:
  _LED_SET NAME=blue LED=bed_light STATUS_ONLY=1 MSG="▶️ Print resumed."

[gcode_macro CANCEL_NOTIFY]
description: Called via mainsail.cfg's user_cancel_macro hook, before CANCEL_PRINT_BASE runs.
gcode:
  _LED_SET NAME=off LED=bed_light MSG="🛑 Print cancelled."

# mainsail.cfg's own [gcode_macro _CLIENT_VARIABLE] template is fully commented out (it's a
# vendored, read-only file meant to be copied in and customized) - only the variables this
# repo actually needs are set here, not the full template, to avoid silently changing PAUSE/
# CANCEL_PRINT/park behavior that already works fine on its built-in defaults. retract/unretract
# are bumped from mainsail.cfg's 1.0mm default to reduce nozzle ooze during a runout-triggered
# pause's manual filament-swap dwell (direct-drive toolhead, so 4mm is enough without risking a
# retract skip); _LOAD_FILAMENT's own RETRACT_AFTER default reads this same unretract value, so
# raising it here keeps a manual reload in sync with what RESUME will unretract afterward.
# runout_sensor gates RESUME the same way vs-146 already does, so a resume can't proceed if
# filament was never actually reloaded after a runout pause.
[gcode_macro _CLIENT_VARIABLE]
variable_user_resume_macro: "RESUME_NOTIFY"
variable_user_cancel_macro: "CANCEL_NOTIFY"
variable_runout_sensor: "filament_switch_sensor Filament_Runout_Sensor"
variable_retract: 4.0
variable_speed_retract: 35.0
variable_unretract: 4.0
variable_speed_unretract: 35.0
gcode:

[gcode_macro LOAD_FILAMENT]
description: Load filament (see macros/filament.cfg's _LOAD_FILAMENT for the underlying engine).
gcode:
  _LOAD_FILAMENT EXTRUDER={params.EXTRUDER|default(printer.extruder.target)|int} LENGTH=30 LOAD_SPEED=300 PRIME_LENGTH=15 PRIME_SPEED=150

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament (see macros/filament.cfg's _UNLOAD_FILAMENT for the underlying engine).
gcode:
  _UNLOAD_FILAMENT EXTRUDER={params.EXTRUDER|default(printer.extruder.target)|int} PURGE_LENGTH=10 PURGE_SPEED=300 RETRACT_LENGTH=40 RETRACT_SPEED=1800

