# These macros are required for Fluidd to correctly function.
# You can copy these entries into your printer.cfg.
# 
# Alternatively, import this file by adding
# this line into your printer.cfg;
# 
# [include client_macros.cfg]

[pause_resume]

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
  TURN_OFF_HEATERS
  CLEAR_PAUSE
  SDCARD_RESET_FILE
  SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
  BASE_CANCEL_PRINT

[gcode_macro PAUSE]
description: Pause the running print
rename_existing: PAUSE_BASE
variable_extrude: 1.7
gcode:
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  PAUSE_BASE
  SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0

  {% if printer.extruder.can_extrude|lower == 'true' %}
    M83
    G1 E-{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}

  PARK

[gcode_macro RESUME]
description: Resume the running print
rename_existing: RESUME_BASE
gcode:
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  M117

  # get VELOCITY parameter if specified
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
  {%else %}
    {% set get_params = "" %}
  {% endif %}

  {% if printer.extruder.can_extrude|lower == 'true' %}
    M83
    G1 E{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}  

  SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
  RESUME_BASE {get_params}
