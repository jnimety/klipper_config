# Enderwire silicone brush + drop hole on the bed's front-right corner (printables.com/model/1143673).
# All brush/bucket geometry lives here; CLEAN_NOZZLE reads it.
[gcode_macro CLEAN_NOZZLE_PARK]
description: Park the nozzle over the purge bucket.
# leaves the nozzle at bucket_z, below the brush top - lift before any XY move (CLEAN_NOZZLE does)
variable_bucket_x: 226
variable_bucket_y: -6
variable_brush_x: 203              # brush center
variable_brush_y: -6
variable_brush_width: 37           # X
variable_brush_depth: 8            # Y
variable_brush_margin: 1.5         # keep strokes this far inside the brush edges
variable_brush_z: -0.4             # bristle tops measured at Z0.6-0.7; scrub ~1mm into them
variable_bucket_z: 1               # park height over the hole while heating
variable_travel_z: 10              # XY travel to/from the brush; the brush is the tallest part, the bracket sits below the bed
variable_travel_speed: 150         # mm/s
variable_wipe_qty: 6
variable_wipe_speed: 150           # mm/s
variable_wipe_accel: 1500
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    { action_raise_error("CLEAN_NOZZLE_PARK: home all axes first") }
  {% endif %}
  SAVE_GCODE_STATE NAME=clean_nozzle_park
  G90
  G1 Z{travel_z} F{travel_speed * 60}
  G1 X{bucket_x} Y{bucket_y} F{travel_speed * 60}
  G1 Z{bucket_z} F{travel_speed * 60}
  RESTORE_GCODE_STATE NAME=clean_nozzle_park

[gcode_macro CLEAN_NOZZLE]
description: Scrub the nozzle across the silicone brush, finishing over the bucket.
gcode:
  {% set c = printer["gcode_macro CLEAN_NOZZLE_PARK"] %}
  {% set travel = c.travel_speed * 60 %}
  {% set wipe = c.wipe_speed * 60 %}
  {% set saved_accel = printer.toolhead.max_accel %}
  {% set x_min = c.brush_x - c.brush_width / 2 + c.brush_margin %}
  {% set x_max = c.brush_x + c.brush_width / 2 - c.brush_margin %}
  {% set y_reach = c.brush_depth / 2 - c.brush_margin %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    { action_raise_error("CLEAN_NOZZLE: home all axes first") }
  {% endif %}
  SAVE_GCODE_STATE NAME=clean_nozzle
  G90
  SET_VELOCITY_LIMIT ACCEL={c.wipe_accel}   # gcode state doesn't cover accel, restored below
  G1 Z{c.travel_z} F{travel}
  G1 X{x_max} Y{c.brush_y} F{travel}
  G1 Z{c.brush_z} F{travel}
  # long strokes, nudging Y each pass to use more of the bristles
  {% for i in range(c.wipe_qty) %}
    {% set y = c.brush_y + (y_reach / 2 if i is even else -y_reach / 2) %}
    G1 X{x_min} Y{y} F{wipe}
    G1 X{x_max} Y{y} F{wipe}
  {% endfor %}
  # short cross strokes at the middle of the brush
  G1 X{c.brush_x} Y{c.brush_y} F{wipe}
  {% for i in range(3) %}
    G1 Y{c.brush_y - y_reach} F{wipe}
    G1 Y{c.brush_y + y_reach} F{wipe}
  {% endfor %}
  # drag out the bucket side at brush depth so any string snaps off over the hole
  G1 X{x_max} Y{c.brush_y} F{wipe}
  G1 X{c.bucket_x} Y{c.bucket_y} F{wipe}
  G1 Z{c.travel_z} F{travel}
  SET_VELOCITY_LIMIT ACCEL={saved_accel}
  RESTORE_GCODE_STATE NAME=clean_nozzle
