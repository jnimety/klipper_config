# mainsail.cfg's own [gcode_macro _CLIENT_VARIABLE] template is fully commented out (it's a
# vendored, read-only file meant to be copied in and customized) - only the variables this
# repo actually needs are set here, not the full template, to avoid silently changing PAUSE/
# CANCEL_PRINT/park behavior that already works fine on its built-in defaults. idle_timeout only
# applies while actually PAUSEd (RESUME/CANCEL_PRINT restore the config-level default of 600s
# afterward) - unlike v0's permanent [idle_timeout] section, this only extends the timeout during
# a real pause (e.g. a long M600 filament swap), not machine-idle time in general. filament_* are
# not part of mainsail.cfg's own template - they feed macros/filament.cfg's shared LOAD_FILAMENT/
# UNLOAD_FILAMENT wrappers instead, which read them the same optional, falls-back-if-unset way as
# every other client.* lookup.
[gcode_macro _CLIENT_VARIABLE]
variable_user_resume_macro: "_RESUME_NOTIFY"
variable_user_cancel_macro: "_CANCEL_NOTIFY"
variable_runout_sensor: "filament_motion_sensor filament_sensor"
variable_idle_timeout: 1800
variable_filament_load_length: 100.0
variable_filament_load_speed: 400.0
variable_filament_prime_length: 65.0
variable_filament_prime_speed: 300.0
variable_filament_unload_purge_length: 10.0
variable_filament_unload_purge_speed: 500.0
variable_filament_unload_retract_length: 115.0
variable_filament_unload_retract_speed: 1000.0
variable_custom_park_dz: 30.0                # more clearance to reach the nozzle than mainsail.cfg's 2mm default
gcode:
