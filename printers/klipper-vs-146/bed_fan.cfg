[gcode_macro BED_FANS]
description: Arm the bed fans for bed target BED (0 disarms). They run only while the bed is within ~2C of target.
variable_threshold: 90                       # bed targets below this (PLA/PETG) leave the fans off
variable_band: 1.0                           # fan watermark sits this far below the bed target
gcode:
  {% set bed = params.BED|default(0)|float %}
  {% if bed >= threshold %}
    # watermark max_delta 1.0: on at bed target, off below bed-2C
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=bed_fan TARGET={bed - band}
  {% else %}
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=bed_fan TARGET=0
  {% endif %}
