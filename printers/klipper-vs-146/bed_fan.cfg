[gcode_macro BED_FANS]
description: Bed fans to full for bed target BED (0 turns them off).
variable_threshold: 90                       # bed targets below this (PLA/PETG) leave the fans off
gcode:
  {% set bed = params.BED|default(0)|float %}
  SET_FAN_SPEED FAN=bed_fan SPEED={1 if bed >= threshold else 0}
