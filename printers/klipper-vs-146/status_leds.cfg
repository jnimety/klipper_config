# hotend_rgb's initial_* is full white for the nozzle pair; bring the logo down to its 5% status level
[delayed_gcode _HOTEND_LOGO_INIT]
initial_duration: 1
gcode:
  _LED_COLOR NAME=white LED=hotend_rgb:1:0.05

[gcode_macro _PRINT_START_NOTIFY]
description: Sets solid blue.
gcode:
  _LED_SET NAME=blue LED=enclosure,hotend_rgb:1:0.05 STATUS_ONLY=1 MSG="{params.MSG}"

[gcode_macro _PRINT_END_NOTIFY]
description: Sets solid green.
gcode:
  _LED_SET NAME=green LED=enclosure,hotend_rgb:1:0.05 MSG="{params.MSG}"

[gcode_macro _ATTENTION_NOTIFY]
description: Sets pulsing yellow.
gcode:
  _LED_SET NAME=yellow LED=enclosure,hotend_rgb:1:0.05 PULSE=1 MSG="{params.MSG}"

[gcode_macro _RESUME_NOTIFY]
description: Sets solid blue.
gcode:
  _LED_SET NAME=blue LED=enclosure,hotend_rgb:1:0.05 STATUS_ONLY=1 MSG="▶️ Print resumed."

[gcode_macro _CANCEL_NOTIFY]
description: Turns the LED off.
gcode:
  _LED_SET NAME=off LED=enclosure,hotend_rgb:1:0.05 MSG="🛑 Print cancelled."

[gcode_macro _HEAT_SOAK_NOTIFY]
description: Sets solid orange.
gcode:
  _LED_SET NAME=orange LED=enclosure,hotend_rgb:1:0.05 STATUS_ONLY=1 MSG="{params.MSG}"

[gcode_macro _HEAT_SOAK_SKIPPED_NOTIFY]
description: Sets solid blue.
gcode:
  _LED_SET NAME=blue LED=enclosure,hotend_rgb:1:0.05 STATUS_ONLY=1 MSG="{params.MSG}"
