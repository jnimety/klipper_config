[include macros/mainsail.cfg]

# This file contains common pin mappings for the BIGTREETECH SKR mini
# E3 v2.0. To use this config, the firmware should be compiled for the
# STM32F103 with a "28KiB bootloader". Also, select "Enable extra
# low-level configuration options" and configure "GPIO pins to set at
# micro-controller startup" to "!PA14".

# The "make flash" command does not work on the SKR mini E3. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR
# mini E3 with that SD card.

# See docs/Config_Reference.md for a description of parameters.


[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 64
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^PC0
position_endstop: 241
position_max: 241
position_min: 0
homing_speed: 70
homing_positive_dir: True

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.500
stealthchop_threshold: 0
interpolate: true

[autotune_tmc stepper_x]
motor: ldo-42sth40-1684ac
tuning_goal: performance

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 64
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^PC1
position_endstop: 235
position_max: 235
position_min: -11
homing_speed: 70
homing_positive_dir: True

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.500
stealthchop_threshold: 0
interpolate: true

[autotune_tmc stepper_y]
motor: ldo-42sth40-1684ac
tuning_goal: performance

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 64
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: probe:z_virtual_endstop
position_max: 225
homing_speed: 40
position_min: -3.0

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.500
stealthchop_threshold: 0
interpolate: true

[autotune_tmc stepper_z]
motor: ldo-42sth40-1684ac
tuning_goal: performance

[safe_z_home]
# home at center of bed adjusted for bltouch offset
home_xy_position: 117.5, 96.5
speed: 40
z_hop: 10
z_hop_speed: 5

[bed_mesh]
speed: 150
horizontal_move_z: 5
mesh_min: 10.0, 10.0
mesh_max: 225, 225
probe_count: 13, 13
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0
# everything relative to the probe closest to the screws_tilt_adjust baseline screw
zero_reference_position: 33.5, 33.5

[bltouch]
sensor_pin: ^PC14
control_pin: PA1
x_offset: 0.0
y_offset: 21.0
# z_offset: 2.7 # See bottom of file
samples: 3
set_output_mode: 5V
stow_on_each_sample: True

[screws_tilt_adjust]
screw1: 32.5, 12.5
screw1_name: front left screw
screw2: 202.5, 12.5
screw2_name: front right screw
screw3: 202.5, 182.5
screw3_name: rear right screw
screw4: 32.5, 182.5
screw4_name: rear left screw
horizontal_move_z: 10
speed: 50
screw_thread: CW-M4

[extruder]
max_extrude_only_accel: 2000
max_extrude_only_distance: 100.0
max_extrude_only_velocity: 60
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD2
microsteps: 32
# rotation_distance for M4 from Voron Discord
# rotation_distance: 22.6789511
rotation_distance: 22.295
gear_ratio: 80:20
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: Generic 3950
sensor_pin: PA0
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 0
max_temp: 300
# set pressure_advance in per filament start G-code
pressure_advance: 0

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.600
interpolate: true
stealthchop_threshold: 0

# LDO 1.8 degree LDO-42STH40-1004AH
# https://cdn.shopify.com/s/files/1/0541/6638/8905/files/LDO-42STH40-1004AH-RevA.pdf?v=1656755879
# Same as LDO-42STH40-1004A
[autotune_tmc extruder]
motor: ldo-42sth40-1004a
tuning_goal: performance

[heater_bed]
heater_pin: PC9
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC3
min_temp: 0
max_temp: 130
pwm_cycle_time: 0.02088 # 47.9Hz for 60Hz grid

# print cooling fan
[fan]
pin: PC6

# heatsink/heatbreak cooling fan
[heater_fan hotend_fan]
pin: PC7
max_power: 1.0
kick_start_time: 0.100
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_37FFD6055358353215710843-if00

[mcu rpi]
serial: /tmp/klipper_host_mcu

[exclude_object]

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu

[temperature_sensor chamber_temp]
sensor_type: Generic 3950
sensor_pin: PC2 # Z-Endstop, see https://github.com/bigtreetech/BIGTREETECH-SKR-mini-E3/issues/632 and https://discord.com/channels/460117602945990666/825356024130175026/865887875295739914
pullup_resistor: 10000
inline_resistor: 100
gcode_id: C

[heater_fan nevermore]
pin: rpi:gpio12
heater: extruder
max_power: 1.0
heater_temp: 40.0
fan_speed: 1.0
shutdown_speed: 0 # Turn off for a shutdown/panic

[temperature_fan raspberry_pi]
sensor_type: temperature_host
pin: rpi:gpio13
control: watermark
target_temp: 1.0
min_temp: 0
max_temp : 90

[heater_fan case]
pin: rpi:gpio18
heater: heater_bed
kick_start_time: 0.5
fan_speed: 0.50
shutdown_speed: 0 # Turn off for a shutdown/panic

# [fan_generic Fan4]
# pin: rpi:gpio26
#
# [fan_generic Fan5]
# pin: rpi:gpio23

[adxl345]
cs_pin: rpi:None

[resonance_tester]
accel_chip: adxl345
probe_points:
  117.5, 117.5, 20

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 28.8
shaper_type_y: mzv
shaper_freq_y: 29.6

[printer]
kinematics: corexz
max_velocity: 200
max_accel: 3000
max_z_velocity: 50
max_z_accel: 3000
square_corner_velocity: 5.0

[static_digital_output usb_pullup_enable]
pins: !PA14

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5, EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PB15, EXP1_10=<5V>

# See the sample-lcd.cfg file for definitions of common LCD displays.

[gcode_arcs]
resolution: 0.1

# [firmware_retraction]
# retract_length: 2
# retract_speed: 25
# unretract_extra_length: 0
# unretract_speed: 25

[neopixel enclosure]
pin: PA8
chain_count: 14
color_order: GRB
initial_RED: 0.3
initial_GREEN: 0.3
initial_BLUE: 0.3

[filament_motion_sensor filament_sensor]
detection_length: 7.0
extruder: extruder
switch_pin: PC15
pause_on_runout: False
runout_gcode:
  RESPOND PREFIX=tgnotify MSG="filament_sensor triggered: running M600..."
  M600

[include macros/prime_line.cfg]
[include macros/print_start.cfg]
[include macros/notify.cfg]
[include macros/filament.cfg]

[gcode_macro LOAD_BED_MESH]
description: Load the saved bed mesh profile and re-home Z.
gcode:
  BED_MESH_PROFILE LOAD=default
  G28 Z

[gcode_macro CHECK_BED_LEVEL]
description: Probe screw tilt and pause for manual adjustment if needed.
gcode:
  SCREWS_TILT_CALCULATE

[gcode_macro PRINT_START_NOTIFY]
description: Called by the shared PRINT_START.
gcode:
  _LED_SET NAME=blue LED=enclosure MSG="{params.MSG}"

[gcode_macro PRINT_END_NOTIFY]
description: Called by PRINT_END.
gcode:
  _LED_SET NAME=green LED=enclosure MSG="{params.MSG}"

[gcode_macro ATTENTION_NOTIFY]
description: Call wherever the printer pauses for manual user input.
gcode:
  _LED_SET NAME=yellow LED=enclosure PULSE=1 MSG="{params.MSG}"

[gcode_macro RESUME_NOTIFY]
description: Called via mainsail.cfg's user_resume_macro hook, before RESUME_BASE runs.
gcode:
  _LED_SET NAME=blue LED=enclosure MSG="Print resumed."

[gcode_macro PRINT_END]
gcode:
  {% set z_lift = params.Z_LIFT|default(10)|float %}
  TURN_OFF_HEATERS
  SAVE_GCODE_STATE NAME=END_state
  G91
  G1 E-2 F2700         ; retract a bit
  G1 E-2 Z0.2 F2400    ; retract and raise Z
  G1 X5 Y5 F3000       ; wipe out
  ; if the tool is less than Z_LIFT away from Z Max, move it to Z max, otherwise, move Z up Z_LIFT
  {% if printer.toolhead.position.z|float + z_lift|float >= printer.configfile.config["stepper_z"]["position_max"]|float %}
  G90                  ; set absolute positioning
  G1 Z{printer.configfile.config["stepper_z"]["position_max"]|float} F1000 ; Move Z axis up
  {% else %}
  G91                  ; set relative positioning
  G1 Z{z_lift} F1000   ; move Z axis up
  {% endif %}
  RESTORE_GCODE_STATE NAME=END_state
  G90                  ; set absolute positioning
  G1 X{printer.toolhead.axis_minimum.x} Y{printer.toolhead.axis_maximum.y - 15}
  M107                 ; turn off fan
  # UNLOAD_FILAMENT    ; this is a good spot to call an unload
                       ; filament macro, if you are into that sort of thing
  SET_GCODE_OFFSET Z=0 ; reset whatever babystepping you have done
  M84 X Y E            ; disable all steppers but Z
  CLEAR_PAUSE          ; clear whatever PAUSE state you may have if you have it
  BED_MESH_CLEAR
  PRINT_END_NOTIFY MSG="Print Finished!"

[include macros/heat_soak.cfg]

[gcode_macro HEAT_SOAK_NOTIFY]
description: Called by the shared HEAT_SOAK once it starts an actual soak.
gcode:
  _LED_SET NAME=orange LED=enclosure MSG="{params.MSG}"

[gcode_macro SCREWS_TILT_CALCULATE]
rename_existing: BASE_SCREWS_TILT_CALCULATE
gcode:
  M117 Level bed...
  BED_MESH_CLEAR
  G28
  BASE_SCREWS_TILT_CALCULATE
  # figure out how to skip the pause if the results are withing some threshold...
  # {% if printer.screws_tilt_adjust.results... %}
  # {% endif %}
  ATTENTION_NOTIFY MSG="SCREWS_TILT_CALCULATE requires your attention..."
  RESPOND MSG='Run <a class="command text--blue">SCREWS_TILT_CALCULATE</a> as many times as necessary and <a class="command text--blue">RESUME_BASE</a> when finished.'
  {% if not printer.pause_resume.is_paused %}
    PAUSE_BASE
  {% endif %}

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BASE_BED_MESH_CALIBRATE
gcode:
  RESPOND TYPE=command MSG="run HEAT_SOAK and SCREWS_TILT_CALCULATE first."
  BED_MESH_CLEAR
  G28
  BASE_BED_MESH_CALIBRATE
  SAVE_CONFIG

[gcode_macro G32]
gcode:
  {% set bed_temp = params.BED_TEMP|default(100)|float %}

  M190 S{bed_temp}
  HEAT_SOAK
  SCREWS_TILT_CALCULATE
  BED_MESH_CALIBRATE

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament (see macros/filament.cfg's _UNLOAD_FILAMENT for the underlying engine).
gcode:
  _UNLOAD_FILAMENT EXTRUDER={params.EXTRUDER|default(printer.extruder.target)|int} PURGE_LENGTH=10 PURGE_SPEED=500 RETRACT_LENGTH={params.E|default(-20)|float} RETRACT_SPEED=1000

[gcode_macro LOAD_FILAMENT]
description: Load filament (see macros/filament.cfg's _LOAD_FILAMENT for the underlying engine).
gcode:
  _LOAD_FILAMENT EXTRUDER={params.EXTRUDER|default(printer.extruder.target)|int} LENGTH={params.E|default(499.5)|float} LOAD_SPEED=1000 PRIME_LENGTH=65 PRIME_SPEED=400

# mainsail.cfg's own [gcode_macro _CLIENT_VARIABLE] template is fully commented out (it's a
# vendored, read-only file meant to be copied in and customized) - only the variables this
# repo actually needs are set here, not the full template, to avoid silently changing PAUSE/
# CANCEL_PRINT/park behavior that already works fine on its built-in defaults.
[gcode_macro _CLIENT_VARIABLE]
variable_user_resume_macro: "RESUME_NOTIFY"
variable_runout_sensor: "filament_motion_sensor filament_sensor"
gcode:

