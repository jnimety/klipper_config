# This file contains common pin mappings for the BIGTREETECH SKR mini
# E3 v2.0. To use this config, the firmware should be compiled for the
# STM32F103 with a "28KiB bootloader". Also, select "Enable extra
# low-level configuration options" and configure "GPIO pins to set at
# micro-controller startup" to "!PA14".

# The "make flash" command does not work on the SKR mini E3. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR
# mini E3 with that SD card.

# See docs/Config_Reference.md for a description of parameters.


[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 64
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^PC0
position_endstop: 241
position_max: 241
position_min: 0
homing_speed: 70
homing_positive_dir: True

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.500
stealthchop_threshold: 0
interpolate: true

[autotune_tmc stepper_x]
motor: ldo-42sth40-1684ac
tuning_goal: performance

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 64
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^PC1
position_endstop: 235
position_max: 235
position_min: -11
homing_speed: 70
homing_positive_dir: True

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.500
stealthchop_threshold: 0
interpolate: true

[autotune_tmc stepper_y]
motor: ldo-42sth40-1684ac
tuning_goal: performance

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 64
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: probe:z_virtual_endstop
position_max: 225
homing_speed: 40
position_min: -3.0

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.500
stealthchop_threshold: 0
interpolate: true

[autotune_tmc stepper_z]
motor: ldo-42sth40-1684ac
tuning_goal: performance

[safe_z_home]
# home at center of bed adjusted for bltouch offset
home_xy_position: 117.5, 96.5
speed: 40
z_hop: 10
z_hop_speed: 5

[bed_mesh]
speed: 150
horizontal_move_z: 5
mesh_min: 10.0, 10.0
mesh_max: 225, 225
probe_count: 13, 13
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0
# everything relative to the probe closest to the screws_tilt_adjust baseline screw
zero_reference_position: 33.5, 33.5

[bltouch]
sensor_pin: ^PC14
control_pin: PA1
x_offset: 0.0
y_offset: 21.0
# z_offset: 2.7 # See bottom of file
samples: 3
set_output_mode: 5V
stow_on_each_sample: True

[screws_tilt_adjust]
screw1: 32.5, 12.5
screw1_name: front left screw
screw2: 202.5, 12.5
screw2_name: front right screw
screw3: 202.5, 182.5
screw3_name: rear right screw
screw4: 32.5, 182.5
screw4_name: rear left screw
horizontal_move_z: 10
speed: 50
screw_thread: CW-M4

[extruder]
max_extrude_only_accel: 2000
max_extrude_only_distance: 100.0
max_extrude_only_velocity: 60
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD2
microsteps: 32
# rotation_distance for M4 from Voron Discord 
# rotation_distance: 22.6789511
rotation_distance: 22.295
gear_ratio: 80:20
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: Generic 3950
sensor_pin: PA0
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 0
max_temp: 300
# set pressure_advance in per filament start G-code
pressure_advance: 0

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.600
interpolate: true
stealthchop_threshold: 0

# LDO 1.8 degree LDO-42STH40-1004AH
# https://cdn.shopify.com/s/files/1/0541/6638/8905/files/LDO-42STH40-1004AH-RevA.pdf?v=1656755879
# Same as LDO-42STH40-1004A
[autotune_tmc extruder]
motor: ldo-42sth40-1004a
tuning_goal: performance

[heater_bed]
heater_pin: PC9
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC3
min_temp: 0
max_temp: 130
pwm_cycle_time: 0.02088 # 47.9Hz for 60Hz grid

# print cooling fan
[fan]
pin: PC6

# heatsink/heatbreak cooling fan
[heater_fan hotend]
pin: PC7
max_power: 1.0
kick_start_time: 0.100
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_37FFD6055358353215710843-if00

[mcu rpi]
serial: /tmp/klipper_host_mcu

[exclude_object]

[temperature_sensor mcu]
sensor_type: temperature_mcu

[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: PC2 # Z-Endstop, see https://github.com/bigtreetech/BIGTREETECH-SKR-mini-E3/issues/632 and https://discord.com/channels/460117602945990666/825356024130175026/865887875295739914
pullup_resistor: 10000
inline_resistor: 100
gcode_id: C

[heater_fan nevermore]
pin: rpi:gpio12
heater: extruder
max_power: 1.0
heater_temp: 40.0
fan_speed: 1.0
shutdown_speed: 0 # Turn off for a shutdown/panic

[temperature_fan raspberry_pi]
sensor_type: temperature_host
pin: rpi:gpio13
control: watermark
target_temp: 1.0
min_temp: 0
max_temp : 90

[heater_fan case]
pin: rpi:gpio18
heater: heater_bed
kick_start_time: 0.5
fan_speed: 0.50
shutdown_speed: 0 # Turn off for a shutdown/panic

# [fan_generic Fan4]
# pin: rpi:gpio26
# 
# [fan_generic Fan5]
# pin: rpi:gpio23

[adxl345]
cs_pin: rpi:None

[resonance_tester]
accel_chip: adxl345
probe_points:
  117.5, 117.5, 20

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 28.8
shaper_type_y: mzv
shaper_freq_y: 29.6

[printer]
kinematics: corexz
max_velocity: 200
max_accel: 3000
max_z_velocity: 50
max_z_accel: 3000
square_corner_velocity: 5.0

[static_digital_output usb_pullup_enable]
pins: !PA14

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5, EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PB15, EXP1_10=<5V>

# See the sample-lcd.cfg file for definitions of common LCD displays.

[gcode_arcs]
resolution: 0.1

[respond]

# [firmware_retraction]
# retract_length: 2
# retract_speed: 25
# unretract_extra_length: 0
# unretract_speed: 25

[neopixel enclosure]
pin: PA8 
chain_count: 14
color_order: GRB
initial_RED: 0.3
initial_GREEN: 0.3
initial_BLUE: 0.3

[filament_motion_sensor filament_sensor]
detection_length: 7.0
extruder: extruder
switch_pin: PC15
pause_on_runout: False
runout_gcode:
  RESPOND PREFIX=tgnotify MSG="filament_sensor triggered: running M600..."
  M600

[gcode_macro LED_OFF]
gcode:
  SET_LED LED=enclosure RED=0 GREEN=0 BLUE=0

[gcode_macro LED_LOW]
gcode:
  SET_LED LED=enclosure RED=0.3 GREEN=0.3 BLUE=0.3

[gcode_macro LED_MED]
gcode:
  SET_LED LED=enclosure RED=0.5 GREEN=0.3 BLUE=0.5

[gcode_macro LED_HIGH]
gcode:
  SET_LED LED=enclosure RED=1.0 GREEN=1.0 BLUE=1.0

[gcode_macro PRINT_START]
gcode:
  {% set bed_temp = params.BED_TEMP|default(100)|float %}
  {% set extruder_temp = params.EXTRUDER_TEMP|default(190)|int %}
  {% set chamber_temp = params.CHAMBER_TEMP|default("40")|int %}

  LED_MED
  M117
  CLEAR_PAUSE
  M190 S{bed_temp} ; preheat bed
  G28 ; Home all axes once the bed has reached temp
  BED_MESH_PROFILE LOAD=default
  G28 Z
  M117 Heating extruder...
  M109 S{extruder_temp} T0
  M117
  PRIME_LINE

# Parametric PRIME LINE macro.
# Source: #VintageGriffin Voron Discord
# Most settings have sane defaults, but can be overridden with optional input parameters. None of  the input parameters are mandatory.
# Usage:
#    PRIME_LINE
#
# Full list of parameters, use none or any combination:
#    PRIME_LINE NOZZLE=0.4 XPAD=0 YPAD=0 LENGTH=150 PRINT_SPEED=30 TRAVEL_SPEED=200 PURGE=8 RETRACT=1 EXTRUSION_MULTIPLIER=1.25 PRINT_HANDLE=1 HANDLE_FAN=75
#
# Version 1.2
[gcode_macro PRIME_LINE]
description: Print an extruder priming line with optional purge and easy removal handle
gcode:
    # settings
    {% set line = {
      'x_padding'      : params.XPAD|default(0)|float,  # left/right padding around the bed the line can't print into
      'y_padding'      : params.YPAD|default(0)|float,  # top/bottom padding around the bed the line can't print into
      'initial_purge'  : params.PURGE|default(8)|int,   # mm of filament to purge before printing. set to 0 to disable
      'retract_after'  : params.RETRACT|default(1)|int, # mm of filament to retract after printing. set to 0 to disable
      'length'         : params.LENGTH|default(150)|int,   # mm, length of the prime line
      'print_speed'    : params.PRINT_SPEED|default(30)|int,
      'travel_speed'   : params.TRAVEL_SPEED|default(200)|int,
      'extr_multi'     : params.EXTRUSION_MULTIPLIER|default(1.25)|float,  # apply to prime lines
      'overlap_percent': 80, # how much prime lines overlap each other
    } %}
    {% set handle = {
      'do_print'    : params.PRINT_HANDLE|default(1)|int,  # set to 0 to disable printing the handle
      'fan_percent' : params.HANDLE_FAN|default(75)|int,   # without fan the handle is too small and melty to print upright
      'width'       : 5.0,
      'height'      : 5.0,
      'move_away'   : 60   # how much to move the toolhead away from the printed handle once done. set 0 to disable
    } %}
    {% set nozzle_diameter = params.NOZZLE|default(printer.configfile.config['extruder'].nozzle_diameter|float)|float %}

    # sanity check and computed variables
    {% set max_x, max_y = printer.toolhead.axis_maximum.x|float, printer.toolhead.axis_maximum.y|float %}
    {% set _ = line.update({'width': nozzle_diameter * 1.25, 'height': nozzle_diameter / 2, 'length': [range(line.length-10,line.length+10)|random, max_x - 2 * line.x_padding - 2]|min}) %}
    {% set _ = line.update({'e_per_mm': line.extr_multi * (line.width * line.height) / (3.1415 * (1.75/2)**2), 'x_start': max_x / 2 - line.length / 2, 'y_start': line.y_padding + range(0,5)|random})  %}

    SAVE_GCODE_STATE NAME=STATE_PRIME_LINE

    {action_respond_info('Printing prime line')}
    M117 Prime Line
    G90 # absolute positioning
    G0 X{line.x_start} Y{line.y_start + (handle.width / 2)|int + 1} Z{line.height} F{line.travel_speed * 60} # move to starting position
    G91 # relative positioning
    G1 E{line.initial_purge} F{5 * 60} # extrude at ~12mm3/sec
    G0 F{line.print_speed * 60} # set print speed
    G1 X{line.length} E{line.length * line.e_per_mm} # print forward line
    G0 Y{line.width * line.overlap_percent / 100} # overlap forward line
    G1 X-{line.length / 2} E{(line.length / 2) * line.e_per_mm}  # print backward line for half the length

    # print a handle for easy removal
    {% if handle.do_print != 0 and handle.width != 0 and handle.height != 0 %}
      G0 X{line.length / 2 - handle.width} Y{handle.width / 2} F{line.travel_speed * 60} # move into position for printing handle
      G0 F{line.print_speed * 60} # set print speed
      {% set saved_fan_speed = (printer['fan'].speed * 256)|int %}
      M106 S{((handle.fan_percent / 100) * 256)|int} # set part fan to desired speed
      {% for _ in range((line.height * 1000)|int, (handle.height * 1000)|int, (line.height * 1000)|int) %} # loop however many cycles it takes to print required handle height
        G1 Y{loop.cycle(-1.0, 1.0) * handle.width} E{handle.width * line.e_per_mm} # handle layer
        G0 X-{line.width * 0.2} Z{line.height} # move up and shift the layer to make the handle sloping
      {% endfor %}
      M106 S{saved_fan_speed} # restore previous part fan speed
    {% endif %}

    G1 E-{line.retract_after} F{50 * 60} # retract ar 50mm/sec after printing
    G0 Y{handle.move_away} F{line.travel_speed * 60}
    M117

    RESTORE_GCODE_STATE NAME=STATE_PRIME_LINE

[gcode_macro PRINT_END]
gcode:
  {% set z_lift = params.Z_LIFT|default(10)|float %}
  TURN_OFF_HEATERS
  SAVE_GCODE_STATE NAME=END_state
  G91
  G1 E-2 F2700         ; retract a bit
  G1 E-2 Z0.2 F2400    ; retract and raise Z
  G1 X5 Y5 F3000       ; wipe out
  ; if the tool is less than Z_LIFT away from Z Max, move it to Z max, otherwise, move Z up Z_LIFT
  {% if printer.toolhead.position.z|float + z_lift|float >= printer.configfile.config["stepper_z"]["position_max"]|float %}
  G90                  ; set absolute positioning
  G1 Z{printer.configfile.config["stepper_z"]["position_max"]|float} F1000 ; Move Z axis up
  {% else %}
  G91                  ; set relative positioning
  G1 Z{z_lift} F1000   ; move Z axis up
  {% endif %}
  RESTORE_GCODE_STATE NAME=END_state
  G90                  ; set absolute positioning
  G1 X{printer.toolhead.axis_minimum.x} Y{printer.toolhead.axis_maximum.y - 15}
  M107                 ; turn off fan
  # UNLOAD_FILAMENT    ; this is a good spot to call an unload
                       ; filament macro, if you are into that sort of thing
  SET_GCODE_OFFSET Z=0 ; reset whatever babystepping you have done
  M84 X Y E            ; disable all steppers but Z
  CLEAR_PAUSE          ; clear whatever PAUSE state you may have if you have it
  BED_MESH_CLEAR
  LED_LOW
  RESPOND PREFIX=tgnotify MSG="Print Finished!"

[gcode_macro HEAT_SOAK]
gcode:
  {% set bed_temp = params.BED_TEMP|default(100)|float %}
  {% set duration = params.DURATION|default(20)|int %}
  M117 Heating bed...
  RESPOND TYPE=command MSG="Heating bed..."
  {% if duration <= 0 or (printer.heater_bed.temperature|float >= (bed_temp - 2.0)) %}
    RESPOND TYPE=command MSG="DURATION 0 or BED_TEMP already at target temperature. Skipping heat soak..."
    M190 S{bed_temp} # make sure we're at the requested temp and not above
  {% else %}
    SET_LED LED=enclosure RED=.5 GREEN=0 BLUE=0
    M190 S{bed_temp} # come up to temp
    M117 Heat soak for {duration} minutes...
    RESPOND TYPE=command MSG="Heat soak for {duration} minutes..."
    M106 S255 ; run cooling fans at full power to circulate air
    {% for timer in range(duration, 0, -1) %}
      # we cycle once a minute, so we can send an update,
      # rather than just sleeping for the entire soak
      M117 Heat Soak: {timer|int}m remaining
      M105
      G4 P60000
    {% endfor %}
    M107 ; turn off cooling fans
  {% endif %}
  M117

[gcode_macro SCREWS_TILT_CALCULATE]
rename_existing: BASE_SCREWS_TILT_CALCULATE
gcode:
  M117 Level bed...
  BED_MESH_CLEAR
  G28
  BASE_SCREWS_TILT_CALCULATE
  # figure out how to skip the pause if the results are withing some threshold...
  # {% if printer.screws_tilt_adjust.results... %}
  # {% endif %}
  RESPOND PREFIX=tgnotify MSG="SCREWS_TILT_CALCULATE requires your attention..."
  RESPOND MSG='Run <a class="command text--blue">SCREWS_TILT_CALCULATE</a> as many times as necessary and <a class="command text--blue">RESUME_BASE</a> when finished.'
  {% if not printer.pause_resume.is_paused %}
    PAUSE_BASE
  {% endif %}

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BASE_BED_MESH_CALIBRATE
gcode:
  RESPOND TYPE=command MSG="run HEAT_SOAK and SCREWS_TILT_CALCULATE first."
  BED_MESH_CLEAR
  G28
  BASE_BED_MESH_CALIBRATE
  SAVE_CONFIG

[gcode_macro G32]
gcode:
  {% set bed_temp = params.BED_TEMP|default(100)|float %}

  HEAT_SOAK BED_TEMP={bed_temp}
  SCREWS_TILT_CALCULATE
  BED_MESH_CALIBRATE

[gcode_macro M600]
gcode:
  {% set e = params.E|default(-20)|float %}
  
  PAUSE         ; PAUSE/RESUME saves state and PARKs
  G91
  G0 E10 F500   ; extrude filament to get better blob on end
  G0 E{e} F600  ; retract additional filament to move out of melt zone
  G92 E0
  RESPOND PREFIX=tgnotify MSG="Filament Change (M600) needs your attention."
  RESPOND TYPE=command MSG='<a class="command text--blue">LOAD_FILAMENT</a> then <a class="command text--blue">RESUME</a> to continue printing.'

[gcode_macro UNLOAD_FILAMENT]
gcode:
  {% set e = params.E|default(-20)|float %}
  {% set extruder = params.EXTRUDER|default(printer.extruder.target)|int %}

  M109 S{extruder}            # set hotend temperature and wait
  M83                         # relative positioning on extruder
  G0 E10 F500                 # extrude filament to get better blob on end
  G0 E{e} F1000               # retract
  G92 E0

[gcode_macro LOAD_FILAMENT]
gcode:
  {% set retract = printer["gcode_macro PAUSE"].extrude|float %} # After loading filament retract the same amount that PAUSE/RESUME expect
  {% set e = params.E|default(99.9)|float %}
  {% set extruder = params.EXTRUDER|default(printer.extruder.target)|int %}

  M109 S{extruder}            # set hotend temperature and wait
  M83                         # relative positioning on extruder
  {% for timer in range(0, 5, 1) %}
    G0 E{e} F1000
  {% endfor %}
  G0 E65 F400                 # prime extruder
  G0 E-{retract} F1000              # retract
  G92 E0

[include client.cfg]

[gcode_macro PARK]
gcode:
  {% set x_park = printer.toolhead.axis_minimum.x|float + 5.0 %}
  {% set y_park = printer.toolhead.axis_minimum.y|float + 5.0 %}
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - 20.0) %}
      {% set z_safe = 20.0 %}
  {% else %}
      {% set z_safe = max_z - act_z %}
  {% endif %}

  {% if "xyz" in printer.toolhead.homed_axes %}
    G91
    G1 Z{z_safe} F2100
    G90
    G0 X{x_park} Y{y_park} F6000
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %} 

[include client_macros.cfg]

[include macros/debug.cfg]

