[include macros/mainsail.cfg]

#####################################################################
# System / MCU
#####################################################################

# This file contains common pin mappings for the BIGTREETECH SKR mini
# E3 v2.0. To use this config, the firmware should be compiled for the
# STM32F103 with a "28KiB bootloader". Also, select "Enable extra
# low-level configuration options" and configure "GPIO pins to set at
# micro-controller startup" to "!PA14".

# The "make flash" command does not work on the SKR mini E3. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR
# mini E3 with that SD card.

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_37FFD6055358353215710843-if00

[mcu rpi]
serial: /tmp/klipper_host_mcu

# query via ~/klipper/scripts/canbus_query.py can0
[mcu EBBCan]
canbus_uuid: 7deac5a898dd

# separate CAN node from EBBCan, not routed through it
[mcu cartographer]
canbus_uuid: 973f29a5198f

[printer]
kinematics: corexz
max_velocity: 200
max_accel: 3000
max_z_velocity: 50
max_z_accel: 3000
square_corner_velocity: 5.0

[exclude_object]

[static_digital_output usb_pullup_enable]
pins: !PA14

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5, EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PB15, EXP1_10=<5V>

[gcode_arcs]
resolution: 0.1

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu

#####################################################################
# X/Y Stepper Settings
#####################################################################

[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 64
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^EBBCan:gpio24                  # dedicated Endstop header on the EBB board
position_endstop: 241
position_max: 241
position_min: -8
homing_speed: 70
homing_positive_dir: True

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.500
sense_resistor: 0.110
stealthchop_threshold: 0
interpolate: true

[autotune_tmc stepper_x]
motor: ldo-42sth40-1684ac
tuning_goal: performance

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 64
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^PC1
position_endstop: 235
position_max: 235
position_min: -20
homing_speed: 70
homing_positive_dir: True

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.500
sense_resistor: 0.110
stealthchop_threshold: 0
interpolate: true

[autotune_tmc stepper_y]
motor: ldo-42sth40-1684ac
tuning_goal: performance

#####################################################################
# Z Stepper Settings
#####################################################################

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 64
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: probe:z_virtual_endstop
position_max: 210
homing_speed: 40
homing_retract_dist: 0                       # required by cartographer - no mechanical tap/retract like bltouch
position_min: -3.0

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.500
sense_resistor: 0.110
stealthchop_threshold: 0
interpolate: true

[autotune_tmc stepper_z]
motor: ldo-42sth40-1684ac
tuning_goal: performance

#####################################################################
# Bed Leveling / Probe
#####################################################################

[safe_z_home]
# chosen so the probe (nozzle + y_offset) lands at 117.5, 117.5 - same point [resonance_tester] shakes at
home_xy_position: 117.5, 89.5
speed: 40
z_hop: 10
z_hop_speed: 5

[bed_mesh]
# probe_count/speed/horizontal_move_z/adaptive_margin/mesh_pps match cartographer's
# recommended defaults. mesh_min_y raised from bltouch-era 10 to 20: with y_offset 28,
# the nozzle has to reach mesh_min_y - 28 to put the probe there, and stepper_y only
# goes down to -11 - anything below mesh_min_y 17 goes out of range.
speed: 300
horizontal_move_z: 3
mesh_min: 10.0, 20.0
mesh_max: 225, 225
probe_count: 20, 20
algorithm: bicubic
adaptive_margin: 10
mesh_pps: 0, 0
fade_start: 1
fade_end: 10
fade_target: 0
# center of bed travel (stepper_x/y position_min/max midpoints: (0+241)/2, (-11+235)/2)
zero_reference_position: 120.5, 112.0

[cartographer]
mcu: cartographer
x_offset: 0
y_offset: 28

[cartographer scan]

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105

[screws_tilt_adjust]
screw1: 32.5, 12.5
screw1_name: front left screw
screw2: 202.5, 12.5
screw2_name: front right screw
screw3: 202.5, 182.5
screw3_name: rear right screw
screw4: 32.5, 182.5
screw4_name: rear left screw
horizontal_move_z: 10
speed: 50
screw_thread: CW-M4

#####################################################################
# Extruder
#####################################################################

[extruder]
max_extrude_only_accel: 2000
max_extrude_only_velocity: 60
step_pin: EBBCan:gpio18
dir_pin: EBBCan:gpio19
enable_pin: !EBBCan:gpio17
microsteps: 32
rotation_distance: 22.295
gear_ratio: 80:20
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan:gpio7                     # HE0
sensor_type: Generic 3950                    # not the board's onboard MAX31865 - Revo Voron ships a plain NTC
sensor_pin: EBBCan:gpio27                    # TH0
min_temp: 0
max_temp: 300
# set pressure_advance in per filament start G-code
pressure_advance: 0

[tmc2209 extruder]
uart_pin: EBBCan:gpio20                      # single-wire per driver - no shared bus/uart_address here
run_current: 0.600
sense_resistor: 0.110
interpolate: true
stealthchop_threshold: 0

# LDO 1.8 degree LDO-42STH40-1004AH
# https://cdn.shopify.com/s/files/1/0541/6638/8905/files/LDO-42STH40-1004AH-RevA.pdf?v=1656755879
# Same as LDO-42STH40-1004A
[autotune_tmc extruder]
motor: ldo-42sth40-1004a
tuning_goal: performance

#####################################################################
# Bed Heater
#####################################################################

[heater_bed]
heater_pin: PC9
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC3
min_temp: 0
max_temp: 130
pwm_cycle_time: 0.02088                      # 47.9Hz for 60Hz grid

#####################################################################
# Fan Control
#####################################################################

# print cooling fan
[fan]
pin: EBBCan:gpio13

# heatsink/heatbreak cooling fan
[heater_fan hotend_fan]
pin: EBBCan:gpio14
max_power: 1.0
kick_start_time: 0.100
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

[heater_fan nevermore]
pin: rpi:gpio12
heater: extruder
max_power: 1.0
heater_temp: 40.0
fan_speed: 1.0
shutdown_speed: 0                            # Turn off for a shutdown/panic

[temperature_fan raspberry_pi]
sensor_type: temperature_host
pin: rpi:gpio13
control: watermark
target_temp: 1.0
min_temp: 0
max_temp: 90

[heater_fan case]
pin: rpi:gpio18
heater: heater_bed
kick_start_time: 0.5
fan_speed: 0.50
shutdown_speed: 0                            # Turn off for a shutdown/panic

#####################################################################
# Sensors
#####################################################################

[temperature_sensor chamber_temp]
sensor_type: Generic 3950
sensor_pin: PC2                              # Z-Endstop, see https://github.com/bigtreetech/BIGTREETECH-SKR-mini-E3/issues/632 and https://discord.com/channels/460117602945990666/825356024130175026/865887875295739914
pullup_resistor: 10000
inline_resistor: 100
gcode_id: C

[filament_motion_sensor filament_sensor]
detection_length: 7.0
extruder: extruder
switch_pin: PC15
pause_on_runout: False
runout_gcode:
  _ATTENTION_NOTIFY MSG="⚠️ Filament runout detected: running M600..."
  M600

#####################################################################
# Resonance / Input Shaping
#####################################################################

# Cartographer's onboard accelerometer, not the EBB's. cs_pin is V3-specific (V4 uses PA0 - wrong one bootloops)
[adxl345]
cs_pin: cartographer:PA3
spi_bus: spi1

[resonance_tester]
accel_chip: adxl345
probe_points:
  117.5, 117.5, 20

[input_shaper]
# shaper_type_x: mzv
# shaper_freq_x: 28.8
# shaper_type_y: mzv
# shaper_freq_y: 29.6

[shaketune]

#####################################################################
# Stealth Enclosure Lighting
#####################################################################

[neopixel enclosure]
pin: PA8
chain_count: 14
color_order: GRB
initial_RED: 0.3
initial_GREEN: 0.3
initial_BLUE: 0.3

# 3x SK6812 RGBW: 1 behind the logo, 2 flanking the nozzle. Not wired into _LED_SET yet.
[neopixel hotend_rgb]
pin: EBBCan:gpio16
chain_count: 3
color_order: GRBW
initial_RED: 0.3
initial_GREEN: 0.3
initial_BLUE: 0.3
initial_WHITE: 0.0

#####################################################################
# Macros
#####################################################################

[include macros/squiggly_purge.cfg]
[include macros/print_start.cfg]
[include macros/notify.cfg]
[include macros/filament.cfg]
[include macros/park.cfg]
[include macros/print_end.cfg]

[gcode_macro CHECK_BED_LEVEL]
description: Home Z via Cartographer touch mode and calibrate a fresh adaptive mesh.
gcode:
  BED_MESH_CLEAR                 # drop any mesh still active from a prior print so it doesn't skew probe moves below
  M109 S150                      # Ensure nozzle is at 150C, in case it was hot when print started.
  CARTOGRAPHER_TOUCH_HOME        # Home for real Z0
  BED_MESH_CALIBRATE ADAPTIVE=1


[gcode_macro _PRINT_START_NOTIFY]
description: Sets solid blue.
gcode:
  _LED_SET NAME=blue LED=enclosure,hotend_rgb STATUS_ONLY=1 MSG="{params.MSG}"

[gcode_macro _PRINT_END_NOTIFY]
description: Sets solid green.
gcode:
  _LED_SET NAME=green LED=enclosure,hotend_rgb MSG="{params.MSG}"

[gcode_macro _ATTENTION_NOTIFY]
description: Sets pulsing yellow.
gcode:
  _LED_SET NAME=yellow LED=enclosure,hotend_rgb PULSE=1 MSG="{params.MSG}"

[gcode_macro _RESUME_NOTIFY]
description: Sets solid blue.
gcode:
  _LED_SET NAME=blue LED=enclosure,hotend_rgb STATUS_ONLY=1 MSG="▶️ Print resumed."

[gcode_macro _CANCEL_NOTIFY]
description: Turns the LED off.
gcode:
  _LED_SET NAME=off LED=enclosure,hotend_rgb MSG="🛑 Print cancelled."

[include macros/heat_soak.cfg]

[gcode_macro _HEAT_SOAK_NOTIFY]
description: Sets solid orange.
gcode:
  _LED_SET NAME=orange LED=enclosure,hotend_rgb STATUS_ONLY=1 MSG="{params.MSG}"

[gcode_macro _HEAT_SOAK_SKIPPED_NOTIFY]
description: Sets solid blue.
gcode:
  _LED_SET NAME=blue LED=enclosure,hotend_rgb STATUS_ONLY=1 MSG="{params.MSG}"

[gcode_macro SCREWS_TILT_CALCULATE]
rename_existing: BASE_SCREWS_TILT_CALCULATE
gcode:
  M117 📐 Level bed...
  BED_MESH_CLEAR
  G28
  BASE_SCREWS_TILT_CALCULATE
  # figure out how to skip the pause if the results are within some threshold...
  # {% if printer.screws_tilt_adjust.results... %}
  # {% endif %}
  _ATTENTION_NOTIFY MSG="⚠️ SCREWS_TILT_CALCULATE requires your attention..."
  RESPOND MSG='Run <a class="command text--blue">SCREWS_TILT_CALCULATE</a> as many times as necessary and <a class="command text--blue">RESUME_BASE</a> when finished.'
  {% if not printer.pause_resume.is_paused %}
    PAUSE_BASE
  {% endif %}

[gcode_macro G32]
gcode:
  {% set bed_temp = params.BED_TEMP|default(100)|float %}

  M190 S{bed_temp}
  HEAT_SOAK
  SCREWS_TILT_CALCULATE
  BED_MESH_CALIBRATE

# mainsail.cfg's own [gcode_macro _CLIENT_VARIABLE] template is fully commented out (it's a
# vendored, read-only file meant to be copied in and customized) - only the variables this
# repo actually needs are set here, not the full template, to avoid silently changing PAUSE/
# CANCEL_PRINT/park behavior that already works fine on its built-in defaults. idle_timeout only
# applies while actually PAUSEd (RESUME/CANCEL_PRINT restore the config-level default of 600s
# afterward) - unlike v0's permanent [idle_timeout] section, this only extends the timeout during
# a real pause (e.g. a long M600 filament swap), not machine-idle time in general. filament_* are
# not part of mainsail.cfg's own template - they feed macros/filament.cfg's shared LOAD_FILAMENT/
# UNLOAD_FILAMENT wrappers instead, which read them the same optional, falls-back-if-unset way as
# every other client.* lookup.
[gcode_macro _CLIENT_VARIABLE]
variable_user_resume_macro: "_RESUME_NOTIFY"
variable_user_cancel_macro: "_CANCEL_NOTIFY"
variable_runout_sensor: "filament_motion_sensor filament_sensor"
variable_idle_timeout: 1800
variable_filament_load_length: 100.0
variable_filament_load_speed: 1000.0
variable_filament_prime_length: 65.0
variable_filament_prime_speed: 400.0
variable_filament_unload_purge_length: 10.0
variable_filament_unload_purge_speed: 500.0
variable_filament_unload_retract_length: 115.0
variable_filament_unload_retract_speed: 1000.0
gcode:

[include macros/debug.cfg]

