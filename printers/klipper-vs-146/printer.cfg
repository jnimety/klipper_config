[include macros/mainsail.cfg]

#####################################################################
# System / MCU
#####################################################################

# This file contains common pin mappings for the BIGTREETECH SKR mini
# E3 v2.0. To use this config, the firmware should be compiled for the
# STM32F103 with a "28KiB bootloader". Also, select "Enable extra
# low-level configuration options" and configure "GPIO pins to set at
# micro-controller startup" to "!PA14".

# The "make flash" command does not work on the SKR mini E3. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR
# mini E3 with that SD card.

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_37FFD6055358353215710843-if00

[mcu rpi]
serial: /tmp/klipper_host_mcu

# query via ~/klipper/scripts/canbus_query.py can0
[mcu EBBCan]
canbus_uuid: 7deac5a898dd

# separate CAN node from EBBCan, not routed through it
[mcu cartographer]
canbus_uuid: d1dea0e017f5

[printer]
kinematics: corexz
max_velocity: 200
max_accel: 4000
max_z_velocity: 50
max_z_accel: 3000
square_corner_velocity: 5.0

[exclude_object]
[skew_correction]

[static_digital_output usb_pullup_enable]
pins: !PA14

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5, EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PB15, EXP1_10=<5V>

[gcode_arcs]
resolution: 0.1

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu

#####################################################################
# X/Y Stepper Settings
#####################################################################

[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 32
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^EBBCan:gpio24                  # dedicated Endstop header on the EBB board
position_endstop: 241
position_max: 241
position_min: -8
homing_speed: 70
homing_positive_dir: True

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.500
sense_resistor: 0.110
# stealthchop_threshold: 0                    # inert - overridden at runtime by tuning_goal in [autotune_tmc stepper_x]
interpolate: true

[autotune_tmc stepper_x]
motor: ldo-42sth40-1684ac
tuning_goal: performance

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 32
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^PC1
position_endstop: 235
position_max: 235
position_min: -20
homing_speed: 70
homing_positive_dir: True

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.500
sense_resistor: 0.110
# stealthchop_threshold: 0                    # inert - overridden at runtime by tuning_goal in [autotune_tmc stepper_y]
interpolate: true

[autotune_tmc stepper_y]
motor: ldo-42sth40-1684ac
tuning_goal: performance

#####################################################################
# Z Stepper Settings
#####################################################################

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 32
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: probe:z_virtual_endstop
position_max: 210
homing_speed: 40
homing_retract_dist: 0                       # required by cartographer - no mechanical tap/retract like bltouch
position_min: -3.0

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.500
sense_resistor: 0.110
# stealthchop_threshold: 0                    # inert - overridden at runtime by tuning_goal in [autotune_tmc stepper_z]
interpolate: true

[autotune_tmc stepper_z]
motor: ldo-42sth40-1684ac
tuning_goal: performance

#####################################################################
# Bed Leveling / Probe
#####################################################################

[safe_z_home]
# chosen so the probe (nozzle + y_offset) lands at 117.5, 117.5 - same point [resonance_tester] shakes at
home_xy_position: 117.5, 89.5
speed: 40
z_hop: 10
z_hop_speed: 5

[bed_mesh]
# https://docs.cartographer3d.com/cartographer-probe/installation-and-setup/software-configuration/klipper-setup
speed: 300
horizontal_move_z: 3
# 235x235 bed, 10mm margin from the physical edge on all sides (mean 117.5,117.5 = bed center).
# Y's 10mm margin also happens to be nozzle-travel bound, not just edge bound: mesh_min_y - y_offset
# (10 - 28 = -18) is 2mm inside stepper_y position_min (-20) - don't lower mesh_min_y without also
# revisiting position_min. probe_count 21,21 below puts a real point at that center (117.5, 117.5).
mesh_min: 15.0, 15.0
mesh_max: 220, 220
probe_count: 21, 21
algorithm: bicubic
adaptive_margin: 10
mesh_pps: 0, 0
fade_start: 1
fade_end: 10
fade_target: 0
# matches safe_z_home / CARTOGRAPHER_TOUCH_HOME's probe position (see [safe_z_home] above)
zero_reference_position: 117.5, 117.5

[cartographer]
mcu: cartographer
x_offset: 0
y_offset: 28

[cartographer scan]

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105

[screws_tilt_adjust]
screw1: 32.5, 12.5
screw1_name: front left screw
screw2: 202.5, 12.5
screw2_name: front right screw
screw3: 202.5, 182.5
screw3_name: rear right screw
screw4: 32.5, 182.5
screw4_name: rear left screw
horizontal_move_z: 10
speed: 50
screw_thread: CW-M4

#####################################################################
# Extruder
#####################################################################

# https://github.com/JaredC01/Galileo2#klipper-settings-for-g2-extruders-g2e-and-g2sa
[extruder]
max_extrude_only_accel: 2000
max_extrude_only_velocity: 60
step_pin: EBBCan:gpio18
dir_pin: EBBCan:gpio19
enable_pin: !EBBCan:gpio17
microsteps: 16
rotation_distance: 47.088
gear_ratio: 9:1
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
#control: mpc
heater_power: 41                              # Revo 60 @ ~250C, PTC table: docs.kalico.gg/MPC.html#ptc-heater-power
cooling_fan: fan
ambient_temp_sensor: temperature_sensor chamber_temp
heater_pin: EBBCan:gpio7                     # HE0
sensor_type: Generic 3950                    # not the board's onboard MAX31865 - Revo Voron ships a plain NTC
sensor_pin: EBBCan:gpio27                    # TH0
min_temp: 0
max_temp: 300
max_extrude_cross_section: 1.1                  # sized for SQUIGGLY_PURGE's 50mm PURGE_LENGTH, not printing
# set pressure_advance in per filament start G-code
pressure_advance: 0

[tmc2209 extruder]
uart_pin: EBBCan:gpio20                      # single-wire per driver - no shared bus/uart_address here
run_current: 0.600
sense_resistor: 0.110
interpolate: true
# stealthchop_threshold: 0                    # inert - overridden at runtime by tuning_goal in [autotune_tmc extruder]

[autotune_tmc extruder]
motor: ldo-36sth20-1004ahg-9T
tuning_goal: performance

#####################################################################
# Bed Heater
#####################################################################

[heater_bed]
heater_pin: PC9
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC3
min_temp: 0
max_temp: 130
pwm_cycle_time: 0.02088                      # 47.9Hz for 60Hz grid

#####################################################################
# Fan Control
#####################################################################

# print cooling fan
[fan]
pin: EBBCan:gpio13

# heatsink/heatbreak cooling fan
[heater_fan hotend_fan]
pin: EBBCan:gpio14
max_power: 1.0
kick_start_time: 0.100
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

[heater_fan nevermore]
pin: rpi:pwmchip0/pwm0                       # gpio12 (big p4ppa out 1); needs dtoverlay=pwm-2chan,pin=12,func=4,pin2=13,func2=4
hardware_pwm: True
cycle_time: 0.01                             # 100Hz; 25kHz whined and stalled 2-wire fans at low duty
kick_start_time: 0.5                         # 2-wire fans may not self-start at 25%
heater: extruder, heater_bed                 # on if either is above heater_temp
max_power: 1.0
heater_temp: 50.0
fan_speed: 0.50
shutdown_speed: 0                            # Turn off for a shutdown/panic

[static_digital_output raspberry_pi_fan]
pins: rpi:gpio18                             # big p4ppa out 3; always on once klipper_mcu starts

[temperature_sensor raspberry_pi_temp]
sensor_type: temperature_host

[heater_fan case]
pin: rpi:pwmchip0/pwm1                       # gpio13 (big p4ppa out 2); shares the nevermore's pwm-2chan overlay
hardware_pwm: True
cycle_time: 0.01                             # 100Hz, see nevermore
heater: heater_bed
kick_start_time: 2.0
fan_speed: 0.60
shutdown_speed: 0                            # Turn off for a shutdown/panic

#####################################################################
# Sensors
#####################################################################

[temperature_sensor chamber_temp]
sensor_type: Generic 3950
sensor_pin: PC2                              # Z-Endstop, see https://github.com/bigtreetech/BIGTREETECH-SKR-mini-E3/issues/632 and https://discord.com/channels/460117602945990666/825356024130175026/865887875295739914
pullup_resistor: 10000
inline_resistor: 100
gcode_id: C

[filament_motion_sensor filament_sensor]
detection_length: 20.0
extruder: extruder
switch_pin: PC15
pause_on_runout: True
runout_gcode:
  _ATTENTION_NOTIFY MSG="⚠️ Filament runout detected, needs your attention."
  _LOAD_FILAMENT_PROMPT

#####################################################################
# Resonance / Input Shaping
#####################################################################

# Cartographer's onboard accelerometer, not the EBB's. cs_pin is V3-specific (V4 uses PA0 - wrong one bootloops)
[adxl345]
cs_pin: cartographer:PA3
spi_bus: spi1
axes_map: x,-y,-z

[input_shaper]
shaper_type_x: ei
shaper_freq_x: 51.8
damping_ratio_x: 0.066
shaper_type_y: mzv
shaper_freq_y: 34.8

[resonance_tester]
accel_chip: adxl345
probe_points:
  117.5, 117.5, 50
accel_per_hz: 100
sweeping_period: 0

[shaketune]

#####################################################################
# Stealth Enclosure Lighting
#####################################################################

[neopixel enclosure]
pin: PA8
chain_count: 14
color_order: GRB
initial_RED: 0.3
initial_GREEN: 0.3
initial_BLUE: 0.3

# 3x SK6812 RGBW: 1 behind the logo, 2 flanking the nozzle. Not wired into _LED_SET yet.
[neopixel hotend_rgb]
pin: EBBCan:gpio16
chain_count: 3
color_order: GRBW
initial_RED: 0.3
initial_GREEN: 0.3
initial_BLUE: 0.3
initial_WHITE: 0.0

#####################################################################
# Macros
#####################################################################

[include macros/squiggly_purge.cfg]
[include macros/print_start.cfg]
[include macros/heat_soak.cfg]
[include macros/mpc.cfg]
[include macros/notify.cfg]
[include macros/filament.cfg]
[include macros/park.cfg]
[include macros/print_end.cfg]
[include macros/debug.cfg]

# printer-specific overrides - must come after the shared defaults above
[include bed_level.cfg]
[include clean_nozzle.cfg]
[include status_leds.cfg]
[include client_variables.cfg]

