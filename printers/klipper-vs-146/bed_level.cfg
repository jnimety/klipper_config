[gcode_macro CHECK_BED_LEVEL]
description: Home Z via Cartographer touch mode and calibrate a fresh adaptive mesh.
gcode:
  BED_MESH_CLEAR                 # drop any mesh still active from a prior print so it doesn't skew probe moves below
  CLEAN_NOZZLE_PARK              # let any heat-up ooze drop in the bucket
  M109 S150                      # Ensure nozzle is at 150C, in case it was hot when print started.
  CLEAN_NOZZLE                   # touch home is only as accurate as the nozzle tip is clean
  CARTOGRAPHER_TOUCH_HOME        # Home for real Z0
  BED_MESH_CALIBRATE ADAPTIVE=1

[gcode_macro SCREWS_TILT_CALCULATE]
rename_existing: BASE_SCREWS_TILT_CALCULATE
gcode:
  {% set tolerance = params.TOLERANCE|default(0.05)|float %}
  M117 📐 Level bed...
  BED_MESH_CLEAR
  # results are relative to the base screw, so re-homing between adjustment passes isn't needed
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  BASE_SCREWS_TILT_CALCULATE
  # a macro's whole gcode: block is templated in one pass before any of its commands run, so
  # results here would be stale (from before BASE_SCREWS_TILT_CALCULATE) - do the check in a
  # separate macro call instead, which gets its own template pass once it's actually dispatched
  _SCREWS_TILT_CHECK TOLERANCE={tolerance}

[gcode_macro _SCREWS_TILT_CHECK]
gcode:
  {% set tolerance = params.TOLERANCE|default(0.05)|float %}
  # results[x].z is an absolute probed height, not a delta - find the base screw's z ourselves
  {% set ns = namespace(base_z=0, max_dev=0) %}
  {% for name, r in printer.screws_tilt_adjust.results.items() %}
    {% if r.is_base %}{% set ns.base_z = r.z %}{% endif %}
  {% endfor %}
  {% for name, r in printer.screws_tilt_adjust.results.items() %}
    {% set ns.max_dev = [(r.z - ns.base_z)|abs, ns.max_dev]|max %}
  {% endfor %}
  {% if ns.max_dev <= tolerance %}
    RESPOND MSG='{"✅ Bed level within tolerance (%.3fmm <= %.3fmm)." % (ns.max_dev, tolerance)}'
    {% if printer.pause_resume.is_paused %}
      RESUME_BASE
      _RESUME_NOTIFY
    {% endif %}
  {% else %}
    _ATTENTION_NOTIFY MSG="⚠️ SCREWS_TILT_CALCULATE requires your attention..."
    RESPOND MSG='Run <a class="command text--blue">SCREWS_TILT_CALCULATE</a> as many times as necessary and <a class="command text--blue">RESUME_BASE</a> when finished.'
    {% if not printer.pause_resume.is_paused %}
      PAUSE_BASE
    {% endif %}
  {% endif %}

[gcode_macro G32]
gcode:
  {% set bed_temp = params.BED_TEMP|default(100)|float %}

  M190 S{bed_temp}
  HEAT_SOAK
  SCREWS_TILT_CALCULATE
  BED_MESH_CALIBRATE
