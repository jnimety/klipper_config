# yellow from _LED_COLOR, breathing 0.2-1.0: the floor keeps it from reading as "off" at a glance
[led_effect attention_bed_light]
leds:
  neopixel:bed_light
autostart: false
frame_rate: 24
layers:
  breathing 7 0 add (0.8,0.8,0,0)
  static    0 0 top (0.2,0.2,0,0)

[gcode_macro _PRINT_START_NOTIFY]
description: Sets solid blue.
gcode:
  _LED_SET NAME=blue LED=bed_light STATUS_ONLY=1 MSG="{params.MSG}"

[gcode_macro _PRINT_END_NOTIFY]
description: Sets solid green.
gcode:
  _LED_SET NAME=green LED=bed_light MSG="{params.MSG}"

[gcode_macro _HEAT_SOAK_NOTIFY]
description: Sets solid orange.
gcode:
  _LED_SET NAME=orange LED=bed_light STATUS_ONLY=1 MSG="{params.MSG}"

[gcode_macro _HEAT_SOAK_SKIPPED_NOTIFY]
description: Sets solid blue.
gcode:
  _LED_SET NAME=blue LED=bed_light STATUS_ONLY=1 MSG="{params.MSG}"

[gcode_macro _ATTENTION_NOTIFY]
description: Sets pulsing yellow.
gcode:
  _LED_SET NAME=yellow LED=bed_light EFFECT=attention_bed_light MSG="{params.MSG}"

[gcode_macro _RESUME_NOTIFY]
description: Sets solid blue.
gcode:
  _LED_SET NAME=blue LED=bed_light STATUS_ONLY=1 MSG="▶️ Print resumed."

[gcode_macro _CANCEL_NOTIFY]
description: Turns the LED off.
gcode:
  _LED_SET NAME=off LED=bed_light MSG="🛑 Print cancelled."
