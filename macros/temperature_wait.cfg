[gcode_macro TEMPERATURE_WAIT_WITH_TIMEOUT]
description: TEMPERATURE_WAIT that gives up after TIMEOUT seconds. Params: SENSOR, MINIMUM and/or MAXIMUM, TIMEOUT, POLL (default 10s).
gcode:
  {% set sensor = params.SENSOR|default("") %}
  {% set timeout_s = params.TIMEOUT|float %}
  {% set poll_s = params.POLL|default(10)|float %}
  {% if sensor not in printer %}
    {action_raise_error("TEMPERATURE_WAIT_WITH_TIMEOUT: unknown SENSOR '%s'" % sensor)}
  {% endif %}
  {% if 'MINIMUM' not in params and 'MAXIMUM' not in params %}
    {action_raise_error("TEMPERATURE_WAIT_WITH_TIMEOUT: MINIMUM or MAXIMUM required")}
  {% endif %}
  # Jinja renders once per call, so each live temp check has to be its own macro call.
  # Unrolled to TIMEOUT/POLL steps; each dwells one POLL interval only while out of range, so the
  # total wait is capped at TIMEOUT and remaining steps after the target is reached are no-ops.
  #
  # NOTE: every remaining step after the target is reached re-checks, so if the temp
  # drifts back out of range, waiting resumes (still within the same TIMEOUT cap).
  {% for i in range((timeout_s / poll_s)|round(0, 'ceil')|int) %}
    _TEMPERATURE_WAIT_STEP SENSOR="{sensor}" POLL={poll_s} {"MINIMUM=%s" % params.MINIMUM if 'MINIMUM' in params else ""} {"MAXIMUM=%s" % params.MAXIMUM if 'MAXIMUM' in params else ""}
  {% endfor %}

[gcode_macro _TEMPERATURE_WAIT_STEP]
gcode:
  {% set temp = printer[params.SENSOR].temperature %}
  # Same range semantics as TEMPERATURE_WAIT: in range means MINIMUM <= temp <= MAXIMUM
  {% if ('MINIMUM' in params and temp < params.MINIMUM|float) or ('MAXIMUM' in params and temp > params.MAXIMUM|float) %}
    G4 P{(params.POLL|float * 1000)|int}  ; dwell is in ms
  {% endif %}
