#####################################################################
#   Kalico MPC (https://docs.kalico.gg/MPC.html) per-material params
#####################################################################

[gcode_macro _SET_MPC_MATERIAL]
description: Set heater MPC filament params for a given material (no-op if MATERIAL not passed)
variable_filament_table:
    {
        "PLA"       : ( 1.25, 2.20 ),
        "PETG"      : ( 1.27, 2.20 ),
        "PC+ABS"    : ( 1.15, 2.20 ),
        "ABS"       : ( 1.06, 2.40 ),
        "ASA"       : ( 1.07, 2.10 ),
        "PA6"       : ( 1.12, 2.50 ),
        "PA"        : ( 1.15, 2.50 ),
        "PC"        : ( 1.20, 1.90 ),
        "TPU"       : ( 1.21, 2.00 ),
        "TPU-90A"   : ( 1.15, 2.00 ),
        "TPU-95A"   : ( 1.22, 2.00 ),
        "ABS-CF"    : ( 1.11, 2.40 ),
        "ASA-CF"    : ( 1.11, 2.10 ),
        "PA6-CF"    : ( 1.19, 2.50 ),
        "PC+ABS-CF" : ( 1.22, 2.20 ),
        "PC+CF"     : ( 1.36, 1.90 ),
        "PLA-CF"    : ( 1.29, 2.20 ),
        "PETG-CF"   : ( 1.30, 2.20 ),
    }
gcode:
    {% set heater = params.HEATER | default('extruder') %}
    {% set material = params.MATERIAL | default('') | upper %}

    {% if material == '' %}
        # nothing passed (slicer profile not updated yet) - leave MPC params alone
    {% elif material in filament_table %}
        {% set (density, heat_capacity) = filament_table[material] %}
        RESPOND PREFIX=🔥 MSG="Configured {heater} MPC for {material}. Density: {density}, Heat Capacity: {heat_capacity}"
        MPC_SET HEATER={heater} FILAMENT_DENSITY={density} FILAMENT_HEAT_CAPACITY={heat_capacity}
    {% else %}
        RESPOND PREFIX=🔥 MSG="Unknown material '{material}', leaving current MPC params for {heater}"
    {% endif %}
