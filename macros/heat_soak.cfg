[gcode_macro HEAT_SOAK]
description: Wait for the chamber to reach temperature (skipped if no target is set). Pass CHAMBER and/or CHAMBER_MINIMAL — whichever is lower (and >0) is the wait target.
gcode:
  {% set target_chamber = params.CHAMBER|default("45")|int %}
  {% set target_chamber_minimal = params.CHAMBER_MINIMAL|default("0")|int %}
  {% set target_chamber_wait = [target_chamber, target_chamber_minimal]|select(">", 0)|min|default(0) %}
  {% if target_chamber_wait <= 0 %}
    RESPOND TYPE=command MSG="No chamber target set. Skipping heat soak..."
  {% else %}
    HEAT_SOAK_INDICATOR ; printer-specific status indicator; no-op where not supported
    M106 S255 ; run cooling fans at full power to circulate air
    M117 Heat soak until chamber reaches {target_chamber_wait}C...
    RESPOND TYPE=command MSG="Heat soak until chamber reaches {target_chamber_wait}C..."
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber_temp" MINIMUM={target_chamber_wait}
    M107 ; turn off cooling fans
  {% endif %}
  M117
