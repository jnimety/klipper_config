[gcode_macro HEAT_SOAK]
description: Wait (no timeout) for the chamber to reach CHAMBER_MINIMAL (or CHAMBER if unset), then keep soaking until CHAMBER is reached or SOAK seconds pass. Skipped if no target is set.
gcode:
  {% set target_chamber = params.CHAMBER|default("45")|int %}
  {% set target_chamber_minimal = params.CHAMBER_MINIMAL|default("0")|int %}
  {% set soak = params.SOAK|default(0)|int %}
  {% set minimal = target_chamber_minimal if target_chamber_minimal > 0 else target_chamber %}
  {% set target = [target_chamber, minimal]|max %}
  {% if target <= 0 %}
    _HEAT_SOAK_SKIPPED_NOTIFY MSG="⏭️ No chamber target set. Skipping heat soak..." ; printer-specific status indicator; no-op where not supported
  {% else %}
    _HEAT_SOAK_NOTIFY MSG="♨️ Heat soak until chamber reaches {minimal}C..." ; printer-specific status indicator; no-op where not supported
    M106 S255 ; run cooling fans at full power to circulate air
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber_temp" MINIMUM={minimal}
    {% if soak > 0 and target > minimal %}
      _HEAT_SOAK_NOTIFY MSG="⏳ Chamber at {minimal}C, soaking up to {(soak / 60)|round(1)} min toward {target}C..."
      TEMPERATURE_WAIT_WITH_TIMEOUT SENSOR="temperature_sensor chamber_temp" MINIMUM={target} TIMEOUT={soak}
    {% endif %}
    M107 ; turn off cooling fans
  {% endif %}
  M117

[gcode_macro M141]
description: No-op - chamber temp is managed by HEAT_SOAK, not slicer M141 calls.
gcode:
  # no chamber heater to set — see HEAT_SOAK

[gcode_macro M191]
description: No-op - chamber temp is managed by HEAT_SOAK, not slicer M191 calls.
gcode:
  # no chamber heater to set/wait on — see HEAT_SOAK
