[gcode_macro HEAT_SOAK]
description: Wait (no timeout) for the chamber to reach CHAMBER_MINIMAL (or CHAMBER if unset), then keep soaking until CHAMBER is reached, SOAK seconds pass, or the chamber rises less than STALL_RISE C (0.7) per STALL_WINDOW s (300). Skipped if no target is set.
gcode: !!include heat_soak.py

[gcode_macro M141]
description: No-op - chamber temp is managed by HEAT_SOAK, not slicer M141 calls.
gcode:
  # no chamber heater to set — see HEAT_SOAK

[gcode_macro M191]
description: No-op - chamber temp is managed by HEAT_SOAK, not slicer M191 calls.
gcode:
  # no chamber heater to set/wait on — see HEAT_SOAK
