[gcode_macro PARK]
description: Park the toolhead - guarded retract, Z-hop, then move to the configured park position. Thin public wrapper around mainsail.cfg's _TOOLHEAD_PARK_PAUSE_CANCEL, the same engine PAUSE/CANCEL_PRINT already use, so PARK, pause, and print-end all park to the same _CLIENT_VARIABLE-configured spot (use_custom_pos/custom_park_x/custom_park_y/custom_park_dz). Pass X=/Y=/Z_MIN= for a one-off override, same as PAUSE accepts. Skipped while already paused - PAUSE sets is_paused and parks as part of the same macro call, so a paused printer is guaranteed already at the park position, and re-running _TOOLHEAD_PARK_PAUSE_CANCEL would fire its _CLIENT_RETRACT a second, uncompensated time on top of whatever the caller (e.g. LOAD_FILAMENT) already accounts for; mainsail.cfg's own CANCEL_PRINT applies this same `not printer.pause_resume.is_paused` guard to its park call, for the same reason. A caller that genuinely needs to force a re-park while paused (e.g. after manually jogging the toolhead away from the park spot) should call _TOOLHEAD_PARK_PAUSE_CANCEL directly instead of PARK - M125 does exactly that below, since it's a direct user "park now" command and shouldn't silently no-op just because the printer happens to be paused.
gcode:
  {% if not printer.pause_resume.is_paused %}
    _TOOLHEAD_PARK_PAUSE_CANCEL {rawparams}
  {% endif %}

[gcode_macro M125]
description: Alias for PARK.
gcode:
    PARK
