[gcode_macro PARK]
description: Park the toolhead - guarded retract, Z-hop, then move to the configured park position. Thin public wrapper around mainsail.cfg's _TOOLHEAD_PARK_PAUSE_CANCEL, the same engine PAUSE/CANCEL_PRINT already use, so PARK, pause, and print-end all park to the same _CLIENT_VARIABLE-configured spot (use_custom_pos/custom_park_x/custom_park_y/custom_park_dz). Pass X=/Y=/Z_MIN= for a one-off override, same as PAUSE accepts.
gcode:
  _TOOLHEAD_PARK_PAUSE_CANCEL {rawparams}

[gcode_macro M125]
gcode:
    PARK
