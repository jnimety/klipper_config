[gcode_macro _LED_COLOR]
description: Sets a single LED to color NAME. LED may be name:index:brightness to target one pixel of a chain at a fixed brightness.
gcode:
  # LED=name[:index[:brightness]] -- index picks one pixel (others keep their color), brightness scales the color
  {% set target = params.LED.split(':') %}
  {% set index = target[1] if target|length > 1 and target[1] else '' %}
  {% set scale = target[2]|float if target|length > 2 else 1.0 %}
  {% set colors = {
    'off':    {'red': 0,   'green': 0,   'blue': 0,   'white': 0},
    'white':  {'red': 1.0, 'green': 1.0, 'blue': 1.0, 'white': 1.0},
    'blue':   {'red': 0,   'green': 0.3, 'blue': 1.0, 'white': 0},
    'orange': {'red': 1.0, 'green': 0.2, 'blue': 0,   'white': 0},
    'yellow': {'red': 1.0, 'green': 1.0, 'blue': 0,   'white': 0},
    'green':  {'red': 0,   'green': 0.8, 'blue': 0,   'white': 0},
    'red':    {'red': 1.0, 'green': 0,   'blue': 0,   'white': 0},
    'purple': {'red': 0.6, 'green': 0,   'blue': 1.0, 'white': 0},
  } %}
  {% set c = colors[params.NAME|lower] %}
  {% set b = [[scale, 0.0]|max, 1.0]|min %}
  SET_LED LED={target[0]} {'INDEX=' ~ index if index else ''} RED={c.red * b} GREEN={c.green * b} BLUE={c.blue * b} WHITE={c.white * b}

[gcode_macro _LED_SET]
description: Sets a status LED (comma-separated LED= for several) and notifies console/Telegram/LCD via MSG. EFFECT= runs printer-local led_effect(s) instead; STATUS_ONLY=1 edits Telegram's live status message instead of pushing a new one.
gcode:
  # effects override SET_LED, so stop them before any solid color
  STOP_LED_EFFECTS
  {% if params.EFFECT %}
    {% for effect in params.EFFECT.split(',') %}
      SET_LED_EFFECT EFFECT={effect.strip()}
    {% endfor %}
  {% else %}
    {% for led in params.LED.split(',') %}
      _LED_COLOR NAME={params.NAME} LED={led.strip()}
    {% endfor %}
  {% endif %}
  {% if params.MSG %}
    # the tgnotify lines also echo to console; each printer's UI hides them with a ^tgnotify console filter
    RESPOND MSG="{params.MSG}"
    {% if params.STATUS_ONLY|default(0)|int %}
      RESPOND PREFIX=tgnotify_status MSG="{params.MSG}"
    {% else %}
      RESPOND PREFIX=tgnotify MSG="{params.MSG}"
    {% endif %}
    M117 {params.MSG}
  {% endif %}

[gcode_macro _PRINT_START_NOTIFY]
description: Default no-op; override per printer to forward MSG to _LED_SET.
gcode:
  # nothing to indicate

[gcode_macro _PRINT_END_NOTIFY]
description: Default no-op; override per printer to forward MSG to _LED_SET.
gcode:
  # nothing to indicate

