[gcode_macro _LED_COLOR]
description: Set an LED to a named color, optionally scaled by BRIGHTNESS (0.0-1.0, default 1.0). Pass NAME and LED (the target [neopixel] object name).
gcode:
  {% set colors = {
    'off':    {'red': 0,   'green': 0,   'blue': 0,   'white': 0},
    'white':  {'red': 1.0, 'green': 1.0, 'blue': 1.0, 'white': 1.0},
    'blue':   {'red': 0,   'green': 0.3, 'blue': 1.0, 'white': 0},
    'orange': {'red': 1.0, 'green': 0.4, 'blue': 0,   'white': 0},
    'yellow': {'red': 1.0, 'green': 1.0, 'blue': 0,   'white': 0},
    'green':  {'red': 0,   'green': 0.8, 'blue': 0,   'white': 0},
    'red':    {'red': 1.0, 'green': 0,   'blue': 0,   'white': 0},
  } %}
  {% set c = colors[params.NAME|lower] %}
  {% set b = params.BRIGHTNESS|default(1.0)|float %}
  SET_LED LED={params.LED} RED={c.red * b} GREEN={c.green * b} BLUE={c.blue * b} WHITE={c.white * b}

[gcode_macro _LED_PULSE_STATE]
description: Internal variable storage for the active LED pulse, if any. Never call directly.
variable_led: ""
variable_name: ""
variable_step: 0
variable_direction: 1
gcode:
  # storage only

[delayed_gcode _LED_PULSE]
initial_duration: 0
gcode:
  {% set state = printer["gcode_macro _LED_PULSE_STATE"] %}
  {% set steps = 24 %}
  {% set raw_step = state.step + state.direction %}
  {% set direction = -1 if raw_step >= steps else (1 if raw_step <= 0 else state.direction) %}
  {% set step = [[raw_step, 0]|max, steps]|min %}
  SET_GCODE_VARIABLE MACRO=_LED_PULSE_STATE VARIABLE=step VALUE={step}
  SET_GCODE_VARIABLE MACRO=_LED_PULSE_STATE VARIABLE=direction VALUE={direction}
  _LED_COLOR NAME={state.name} LED={state.led} BRIGHTNESS={step / steps}
  UPDATE_DELAYED_GCODE ID=_LED_PULSE DURATION=0.15

[gcode_macro _LED_SET]
description: Set a status LED and notify the console/Telegram/LCD of why. Pass NAME and LED; add PULSE=1 for a slow breathing pulse instead of a solid color. Always cancels any pulse already in progress first. Pass MSG to also RESPOND it to the console, to Telegram, and to the LCD (via M117) — every LED change should carry one, so the notification stays in sync with the light. Telegram defaults to a new pushed message (tgnotify prefix); pass STATUS_ONLY=1 to instead fold MSG into the bot's own live-updating status message (tgnotify_status prefix) as a silent in-place edit — only takes effect while a print is active, since that's the only time the bot has a status message to edit. Use STATUS_ONLY=1 for routine "still running fine" updates; leave it off for anything that should actually alert (pauses, print end/cancel).
gcode:
  UPDATE_DELAYED_GCODE ID=_LED_PULSE DURATION=0
  {% if params.PULSE|default(0)|int %}
    SET_GCODE_VARIABLE MACRO=_LED_PULSE_STATE VARIABLE=led VALUE='"{params.LED}"'
    SET_GCODE_VARIABLE MACRO=_LED_PULSE_STATE VARIABLE=name VALUE='"{params.NAME|lower}"'
    SET_GCODE_VARIABLE MACRO=_LED_PULSE_STATE VARIABLE=step VALUE=0
    SET_GCODE_VARIABLE MACRO=_LED_PULSE_STATE VARIABLE=direction VALUE=1
    UPDATE_DELAYED_GCODE ID=_LED_PULSE DURATION=0.15
  {% else %}
    _LED_COLOR NAME={params.NAME} LED={params.LED}
  {% endif %}
  {% if params.MSG %}
    RESPOND MSG="{params.MSG}"
    {% if params.STATUS_ONLY|default(0)|int %}
      RESPOND PREFIX=tgnotify_status MSG="{params.MSG}"
    {% else %}
      RESPOND PREFIX=tgnotify MSG="{params.MSG}"
    {% endif %}
    M117 {params.MSG}
  {% endif %}

[gcode_macro PRINT_START_NOTIFY]
description: Default no-op — override per printer to add a status light. Caller passes MSG; an override should forward it to _LED_SET so the console/Telegram notification stays tied to the actual light change.
gcode:
  # nothing to indicate

[gcode_macro PRINT_END_NOTIFY]
description: Default no-op — override per printer to add a status light. Caller passes MSG; an override should forward it to _LED_SET so the console/Telegram notification stays tied to the actual light change.
gcode:
  # nothing to indicate

[gcode_macro HEAT_SOAK_NOTIFY]
description: Default no-op — override per printer to add a status light. Caller passes MSG; an override should forward it to _LED_SET so the console/Telegram notification stays tied to the actual light change.
gcode:
  # nothing to indicate

[gcode_macro HEAT_SOAK_SKIPPED_NOTIFY]
description: Default no-op — override per printer to add a status light. Called by the shared HEAT_SOAK when no chamber target is set, so nothing is actually heating. Caller passes MSG; an override should forward it to _LED_SET so the console/Telegram notification stays tied to the actual light change.
gcode:
  # nothing to indicate

[gcode_macro ATTENTION_NOTIFY]
description: Default no-op — override per printer to add a status light. Call wherever the printer pauses for manual user input, passing MSG describing why; an override should forward it to _LED_SET so the console/Telegram notification stays tied to the actual light change.
gcode:
  # nothing to indicate

[gcode_macro RESUME_NOTIFY]
description: Default no-op — override per printer to add a status light. Called via mainsail.cfg's user_resume_macro hook, which invokes it bare (no params) — an override can't receive a caller MSG here, so it should pass its own static MSG to _LED_SET directly.
gcode:
  # nothing to indicate

[gcode_macro CANCEL_NOTIFY]
description: Default no-op — override per printer to add a status light. Called via mainsail.cfg's user_cancel_macro hook, which invokes it bare (no params) — an override can't receive a caller MSG here, so it should pass its own static MSG to _LED_SET directly.
gcode:
  # nothing to indicate
