[gcode_macro PRINT_END]
description: Shared, fully hardware-agnostic print-end sequence, used unchanged by both printers.
gcode:
  M400                            ; wait for buffer to clear
  G92 E0                          ; zero the extruder
  G1 E-4 F3600                    ; retract filament
  G91                             ; relative positioning

  {% set th = printer.toolhead %}
  {% set max_x = th.axis_maximum.x|float %}
  {% set max_y = th.axis_maximum.y|float %}
  {% set max_z = th.axis_maximum.z|float %}

  {% set x_safe = 20 if th.position.x < (max_x - 20) else -20 %}
  {% set y_safe = 20 if th.position.y < (max_y - 20) else -20 %}
  {% set z_safe = [2, max_z - th.position.z]|min %}

  G0 X{x_safe} Y{y_safe} Z{z_safe} F20000 ; move nozzle to wipe/remove stringing
  TURN_OFF_HEATERS
  M107                            ; turn off fan
  G90                             ; absolute positioning
  G0 X{max_x / 2} Y{max_y - 10} F3600 ; park nozzle, centered in X
  SET_GCODE_OFFSET Z=0            ; reset whatever babystepping you have done
  M84 X Y E                       ; disable all steppers but Z
  PRINT_END_NOTIFY MSG="✅ Print Finished!"
