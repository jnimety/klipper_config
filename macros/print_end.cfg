[gcode_macro PRINT_END]
description: Shared, fully hardware-agnostic print-end sequence, used unchanged by both printers.
gcode:
  PARK                            ; move off the print first (see macros/park.cfg) so tip-shaping ooze can't land on the model
  _TIP_SHAPING                    ; form a clean point before retracting
  G92 E0                          ; zero the extruder
  G1 E-4 F3600                    ; retract filament
  TURN_OFF_HEATERS
  M107                            ; turn off fan
  M400                            ; wait for buffer to clear
  G90                             ; leave in absolute positioning
  SET_GCODE_OFFSET Z=0            ; reset whatever babystepping you have done
  M84 X Y E                       ; disable all steppers but Z
  _PRINT_END_NOTIFY MSG="✅ Print Finished!"
