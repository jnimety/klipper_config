[gcode_macro _LED_COLOR]
description: Set an LED to a named color, optionally scaled by BRIGHTNESS (0.0-1.0, default 1.0). Pass NAME and LED (the target [neopixel] object name).
gcode:
  {% set colors = {
    'off':    {'red': 0,   'green': 0,   'blue': 0,   'white': 0},
    'white':  {'red': 1.0, 'green': 1.0, 'blue': 1.0, 'white': 1.0},
    'blue':   {'red': 0,   'green': 0.3, 'blue': 1.0, 'white': 0},
    'orange': {'red': 1.0, 'green': 0.4, 'blue': 0,   'white': 0},
    'yellow': {'red': 1.0, 'green': 1.0, 'blue': 0,   'white': 0},
    'green':  {'red': 0,   'green': 0.8, 'blue': 0,   'white': 0},
    'red':    {'red': 1.0, 'green': 0,   'blue': 0,   'white': 0},
  } %}
  {% set c = colors[params.NAME|lower] %}
  {% set b = params.BRIGHTNESS|default(1.0)|float %}
  SET_LED LED={params.LED} RED={c.red * b} GREEN={c.green * b} BLUE={c.blue * b} WHITE={c.white * b}

[gcode_macro _LED_PULSE_STATE]
description: Internal variable storage for the active LED pulse, if any. Never call directly.
variable_led: ""
variable_name: ""
variable_step: 0
variable_direction: 1
gcode:
  # storage only

[delayed_gcode _LED_PULSE]
initial_duration: 0
gcode:
  {% set state = printer["gcode_macro _LED_PULSE_STATE"] %}
  {% set steps = 24 %}
  {% set raw_step = state.step + state.direction %}
  {% set direction = -1 if raw_step >= steps else (1 if raw_step <= 0 else state.direction) %}
  {% set step = [[raw_step, 0]|max, steps]|min %}
  SET_GCODE_VARIABLE MACRO=_LED_PULSE_STATE VARIABLE=step VALUE={step}
  SET_GCODE_VARIABLE MACRO=_LED_PULSE_STATE VARIABLE=direction VALUE={direction}
  _LED_COLOR NAME={state.name} LED={state.led} BRIGHTNESS={step / steps}
  UPDATE_DELAYED_GCODE ID=_LED_PULSE DURATION=0.15

[gcode_macro _LED_SET]
description: Set a status LED. Pass NAME and LED; add PULSE=1 for a slow breathing pulse instead of a solid color. Always cancels any pulse already in progress first.
gcode:
  UPDATE_DELAYED_GCODE ID=_LED_PULSE DURATION=0
  {% if params.PULSE|default(0)|int %}
    SET_GCODE_VARIABLE MACRO=_LED_PULSE_STATE VARIABLE=led VALUE='"{params.LED}"'
    SET_GCODE_VARIABLE MACRO=_LED_PULSE_STATE VARIABLE=name VALUE='"{params.NAME|lower}"'
    SET_GCODE_VARIABLE MACRO=_LED_PULSE_STATE VARIABLE=step VALUE=0
    SET_GCODE_VARIABLE MACRO=_LED_PULSE_STATE VARIABLE=direction VALUE=1
    UPDATE_DELAYED_GCODE ID=_LED_PULSE DURATION=0.15
  {% else %}
    _LED_COLOR NAME={params.NAME} LED={params.LED}
  {% endif %}

[gcode_macro PRINT_START_INDICATOR]
description: Default no-op — override per printer to add a status light.
gcode:
  # nothing to indicate

[gcode_macro PRINT_END_INDICATOR]
description: Default no-op — override per printer to add a status light.
gcode:
  # nothing to indicate

[gcode_macro HEAT_SOAK_INDICATOR]
description: Default no-op — override per printer to add a status light.
gcode:
  # nothing to indicate

[gcode_macro ATTENTION_INDICATOR]
description: Default no-op — override per printer to add a status light. Call wherever the printer pauses for manual user input.
gcode:
  # nothing to indicate

[gcode_macro RESUME_INDICATOR]
description: Default no-op — override per printer to add a status light. Call from RESUME to clear any ATTENTION_INDICATOR pulse.
gcode:
  # nothing to indicate
