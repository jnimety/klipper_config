[gcode_macro _CHUNKED_EXTRUDE]
description: Internal helper - emits an M83-relative extrude-only move of LENGTH mm (positive to feed, negative to retract) at SPEED mm/min, split into equal moves no larger than MAX_CHUNK (default this printer's [extruder] max_extrude_only_distance) so a single long feed/retract never trips Klipper's per-move extrude-only limit (its check is strictly-greater-than, so a chunk exactly at the limit is fine). Emits nothing if LENGTH is 0. Used by LOAD_FILAMENT/UNLOAD_FILAMENT for every extrude-only leg (feed, prime, retract_after, purge, retract) so the chunk-count/chunk-size math lives in one place instead of being recomputed per leg.
gcode:
  {% set length = params.LENGTH|float %}
  {% set speed = params.SPEED|float %}
  {% set max_chunk = params.MAX_CHUNK|default(printer.configfile.settings.extruder.max_extrude_only_distance)|float %}
  {% if length != 0 %}
    {% set num_chunks = [(length|abs / max_chunk)|round(0, 'ceil')|int, 1]|max %}
    {% set chunk_size = length / num_chunks %}
    {% for _ in range(num_chunks) %}
      G0 E{chunk_size} F{speed}
    {% endfor %}
  {% endif %}

[gcode_macro LOAD_FILAMENT]
description: Load filament using this printer's _CLIENT_VARIABLE-configured length/speeds. Pass EXTRUDER (target hotend temp, default current target) or E (total feed distance) to override their _CLIENT_VARIABLE-configured defaults; LOAD_SPEED/PRIME_LENGTH/PRIME_SPEED/RETRACT_AFTER/MAX_CHUNK are likewise optional overrides. RETRACT_AFTER defaults to mainsail.cfg's own RESUME un-retract amount, _CLIENT_VARIABLE.unretract, so the net filament position stays consistent across pause/load/resume; pass RETRACT_AFTER=0 to disable. Every extrude-only move (the feed, the prime, and the final retract) is automatically split into equal moves no larger than this printer's [extruder] max_extrude_only_distance via _CHUNKED_EXTRUDE - callers never need to think about chunking. Deliberately left in M83 (relative extrude) on exit, not restored to M82 - both printers' slicer (OrcaSlicer, "use relative E distances") sets M83 near the start of every print and never switches back, so M83 is the actual standing convention here, not M82.
gcode:
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set extruder = params.EXTRUDER|default(printer.extruder.target)|int %}
  {% set length = params.E|default(client.filament_load_length)|float %}
  {% set load_speed = params.LOAD_SPEED|default(client.filament_load_speed|default(1000))|float %}
  {% set prime_length = params.PRIME_LENGTH|default(client.filament_prime_length|default(0))|float %}
  {% set prime_speed = params.PRIME_SPEED|default(client.filament_prime_speed|default(400))|float %}
  {% set retract_after = params.RETRACT_AFTER|default(client.unretract|default(1.0))|float %}
  {% set max_chunk = params.MAX_CHUNK|default(printer.configfile.settings.extruder.max_extrude_only_distance)|float %}

  M109 S{extruder}
  M83
  _CHUNKED_EXTRUDE LENGTH={length} SPEED={load_speed} MAX_CHUNK={max_chunk}
  {% if prime_length > 0 %}
    _CHUNKED_EXTRUDE LENGTH={prime_length} SPEED={prime_speed} MAX_CHUNK={max_chunk}
  {% endif %}
  {% if retract_after > 0 %}
    _CHUNKED_EXTRUDE LENGTH=-{retract_after} SPEED={load_speed} MAX_CHUNK={max_chunk}
  {% endif %}

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament using this printer's _CLIENT_VARIABLE-configured purge/retract lengths/speeds. Pass EXTRUDER (target hotend temp, default current target) or E (retract length) to override their _CLIENT_VARIABLE-configured defaults; PURGE_LENGTH/PURGE_SPEED/RETRACT_SPEED/MAX_CHUNK are likewise optional overrides. Every extrude-only move (the purge and the retract) is automatically split into equal moves no larger than this printer's [extruder] max_extrude_only_distance via _CHUNKED_EXTRUDE, the same helper LOAD_FILAMENT uses - callers never need to think about chunking.
gcode:
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set extruder = params.EXTRUDER|default(printer.extruder.target)|int %}
  {% set purge_length = params.PURGE_LENGTH|default(client.filament_unload_purge_length|default(0))|float %}
  {% set purge_speed = params.PURGE_SPEED|default(client.filament_unload_purge_speed|default(300))|float %}
  {% set retract_length = params.E|default(client.filament_unload_retract_length)|float|abs %}
  {% set retract_speed = params.RETRACT_SPEED|default(client.filament_unload_retract_speed|default(1000))|float %}
  {% set max_chunk = params.MAX_CHUNK|default(printer.configfile.settings.extruder.max_extrude_only_distance)|float %}

  M109 S{extruder}
  M83
  {% if purge_length > 0 %}
    _CHUNKED_EXTRUDE LENGTH={purge_length} SPEED={purge_speed} MAX_CHUNK={max_chunk}
  {% endif %}
  _TIP_SHAPING
  _CHUNKED_EXTRUDE LENGTH=-{retract_length} SPEED={retract_speed} MAX_CHUNK={max_chunk}

[gcode_macro _TIP_SHAPING]
description: Forms a fine point on the filament tip via a few extrude/retract pulses with pressure advance suppressed, so a following retract pulls back a clean point rather than a blob. Called from UNLOAD_FILAMENT (after M109 has already confirmed the hotend is at temp and any purge has run) and from PRINT_END (before its own retract, while heaters are still on) - both callers already guarantee the hotend is hot before reaching this macro, so (unlike the upstream macro this is adapted from, EricZimmerman/Voron02's _TIP_SHAPING) no separate temperature guard is needed. Uses plain relative extrude/retract pulses instead of upstream's M82+G92 E0 absolute-mode anchor, since both callers are already in M83 (this repo's standing extrude-mode convention) - each pulse already nets to zero displacement, so switching modes isn't necessary.
gcode:
  {% set old_pa = printer.extruder.pressure_advance %}
  SET_PRESSURE_ADVANCE ADVANCE=0
  G1 E2 F3600
  G1 E-2 F3600
  G1 E3 F3600
  G1 E-3 F3600
  G1 E4 F3600
  G1 E-4 F3600
  SET_PRESSURE_ADVANCE ADVANCE={old_pa}

[gcode_macro CHANGE_FILAMENT]
description: Filament change - pause, unload, and prompt to load new filament.
gcode:
  PAUSE                     ; PAUSE/RESUME saves state and parks the toolhead
  UNLOAD_FILAMENT {rawparams}
  _ATTENTION_NOTIFY MSG="⚠️ Filament Change (M600) needs your attention."
  RESPOND TYPE=command MSG='<a class="command text--blue">LOAD_FILAMENT</a> then <a class="command text--blue">RESUME</a> to continue printing.'

[gcode_macro M600]
gcode:
    CHANGE_FILAMENT

[gcode_macro M701]
gcode:
    LOAD_FILAMENT

[gcode_macro M702]
gcode:
    UNLOAD_FILAMENT
