[gcode_macro _LOAD_FILAMENT]
description: Load filament. Pass EXTRUDER (target hotend temp, default current target), LENGTH (total feed distance), LOAD_SPEED; optionally PRIME_LENGTH/PRIME_SPEED (a final, usually slower, prime move), RETRACT_AFTER (a final retract - defaults to mainsail.cfg's own RESUME un-retract amount, _CLIENT_VARIABLE.unretract, so the net filament position stays consistent across pause/load/resume; pass RETRACT_AFTER=0 to disable). LENGTH is automatically split into equal moves no larger than this printer's [extruder] max_extrude_only_distance (Klipper's own limit check is strictly-greater-than, so a move exactly at the limit is fine) - callers never need to think about chunking (override with MAX_CHUNK if needed). Deliberately left in M83 (relative extrude) on exit, not restored to M82 - both printers' slicer (OrcaSlicer, "use relative E distances") sets M83 near the start of every print and never switches back, so M83 is the actual standing convention here, not M82.
gcode:
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set extruder = params.EXTRUDER|default(printer.extruder.target)|int %}
  {% set length = params.LENGTH|float %}
  {% set load_speed = params.LOAD_SPEED|default(1000)|float %}
  {% set prime_length = params.PRIME_LENGTH|default(0)|float %}
  {% set prime_speed = params.PRIME_SPEED|default(400)|float %}
  {% set retract_after = params.RETRACT_AFTER|default(client.unretract|default(1.0))|float %}
  {% set max_extrude_only_distance = printer.configfile.settings.extruder.max_extrude_only_distance|float %}
  {% set max_chunk = params.MAX_CHUNK|default(max_extrude_only_distance)|float %}
  {% set num_chunks = [(length / max_chunk)|round(0, 'ceil')|int, 1]|max %}
  {% set chunk_size = length / num_chunks %}

  M109 S{extruder}
  M83
  {% for _ in range(num_chunks) %}
    G0 E{chunk_size} F{load_speed}
  {% endfor %}
  {% if prime_length > 0 %}
    G0 E{prime_length} F{prime_speed}
  {% endif %}
  {% if retract_after > 0 %}
    G0 E-{retract_after} F{load_speed}
  {% endif %}

[gcode_macro _UNLOAD_FILAMENT]
description: Unload filament. Pass EXTRUDER (target hotend temp, default current target), RETRACT_LENGTH, RETRACT_SPEED; optionally PURGE_LENGTH/PURGE_SPEED (a blob-forming purge before retracting).
gcode:
  {% set extruder = params.EXTRUDER|default(printer.extruder.target)|int %}
  {% set purge_length = params.PURGE_LENGTH|default(0)|float %}
  {% set purge_speed = params.PURGE_SPEED|default(300)|float %}
  {% set retract_length = params.RETRACT_LENGTH|float|abs %}
  {% set retract_speed = params.RETRACT_SPEED|default(1000)|float %}

  M109 S{extruder}
  M83
  {% if purge_length > 0 %}
    G0 E{purge_length} F{purge_speed}
  {% endif %}
  G0 E-{retract_length} F{retract_speed}

[gcode_macro M600]
description: Filament change - pause, unload, and prompt to load new filament.
gcode:
  PAUSE                     ; PAUSE/RESUME saves state and parks the toolhead
  UNLOAD_FILAMENT {rawparams}
  ATTENTION_INDICATOR
  RESPOND PREFIX=tgnotify MSG="Filament Change (M600) needs your attention."
  RESPOND TYPE=command MSG='<a class="command text--blue">LOAD_FILAMENT</a> then <a class="command text--blue">RESUME</a> to continue printing.'
